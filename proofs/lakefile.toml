name = "arp_scheduler"
version = "0.1.0"
defaultTargets = ["Scheduler", "replay"]

# `sorry` is only a warning by default; ADR-060 requires the build to fail on it.
[leanOptions]
warningAsError = true

[[lean_lib]]
name = "Scheduler"

[[lean_exe]]
name = "replay"
root = "Main"

# specdiff's trace oracle: checks engine events against the model one at a time.
[[lean_exe]]
name = "specdiff-oracle"
root = "Oracle"
