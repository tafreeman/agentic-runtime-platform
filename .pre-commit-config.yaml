# Pre-commit configuration: formatting + linting + type checks
# commit-msg stage is installed so the AI-trailer stripper runs on every commit;
# run `pre-commit install --install-hooks` after cloning.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Strip AI-assistant authorship trailers (Claude / Claude Code) from commit
  # messages. Human + legitimate-bot co-authors are preserved.
  - repo: local
    hooks:
      - id: strip-ai-coauthors
        name: strip AI co-author trailers
        entry: python scripts/strip_ai_coauthors.py
        language: system
        stages: [commit-msg]
        always_run: true

  # Rev pinned to the same version as ci-constraints.txt (black==26.5.1) so
  # local hooks and CI-era tooling format identically; bump both together.
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: ["--line-length", "88"]

  # Import sorting is handled by ruff's `I` rules with
  # [tool.ruff.lint.isort] known-first-party = ["agentic_v2"] in
  # agentic-workflows-v2/pyproject.toml. A standalone isort hook is redundant
  # and actively conflicts with ruff (it groups agentic_v2 as third-party and
  # splits comment-tagged imports onto their own line), so the two never reach
  # a fixpoint under `pre-commit run --all-files`. ruff is the single sorter.

  # Rev matches ci-constraints.txt (ruff==0.15.17): CI's lint job runs this
  # exact version over agentic_v2/ and tests/, so a hook-version skew would
  # let local and CI disagree about what "clean" means.
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/myint/docformatter
    rev: v1.7.7
    hooks:
      - id: docformatter
        args: ["--in-place", "--recursive", "--wrap-summaries", "88"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # The hook updates baseline line metadata. Serial execution prevents
        # Windows command batching from racing and repeatedly overwriting it.
        require_serial: true

  # mypy: strict on the agentic-v2-eval PACKAGE SOURCE only (0 findings at
  # this rev, verified). Scoped to src/ — the eval tests were never written
  # to strict typing, and without --follow-imports=skip mypy wanders into the
  # repo-root tools/ package and strict-checks it too (same reason the CI
  # typecheck-core-contracts job passes that flag). Rev matches
  # ci-constraints.txt (mypy==2.1.0). The broader agentic-workflows-v2/ type
  # debt is tracked separately (target Q3 2026).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        name: mypy (agentic-v2-eval src)
        files: ^agentic-v2-eval/src/
        args:
          - "--config-file=agentic-v2-eval/pyproject.toml"
          - "--follow-imports=skip"
        additional_dependencies:
          - "types-PyYAML"

  # pydocstyle: disabled pending Google-convention docstring backfill across
  # agentic_v2/server/ and tools/builtin/ (target Q3 2026).
  # - repo: https://github.com/PyCQA/pydocstyle
  #   rev: 6.3.0
  #   hooks:
  #     - id: pydocstyle
  #       args: ["--convention=google"]
