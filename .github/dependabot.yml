version: 2

# Grouping: each ecosystem batches all of a week's minor/patch bumps into ONE
# pull request (majors are ignored below and never grouped). This collapses the
# ~16 individual PRs we used to get into ~5 grouped PRs, and avoids the pairwise
# lockfile conflicts that separate PRs cause (npm shares one package-lock.json;
# pip shares one uv.lock).
#
# Auto-merge (see .github/workflows/dependabot-auto-merge.yml): npm, github-actions
# and docker patch/minor PRs self-merge once the required checks pass. pip is
# deliberately NOT auto-merged — Dependabot does not regenerate uv.lock, so a pip
# PR must have its lock + ci-constraints.txt re-synced before merge (one grouped
# PR per directory, merged by hand — or via .github/workflows/dependabot-relock.yml
# (workflow_dispatch) — after `uv lock --upgrade` + re-export, i.e. `just relock`).
#
# pip-root is split into pip-root-prod / pip-root-dev (dependency-type filter,
# see below): the root directory's 84-plus tracked packages (7 direct runtime
# deps, ~9 dev-tool deps, plus everything transitive pinned in
# ci-constraints.txt) were arriving as one unreviewable PR. Runtime deps
# (anthropic, openai, langchain-core, pydantic, ...) carry real behavior risk
# and get their own PR; dev-tooling (pytest, ruff, mypy, black, pre-commit,
# ...) is lower-risk and reviewable at a glance separately. pip-runtime and
# pip-eval stay single groups — each is already small (3 and a handful of
# updates respectively).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    # Major bumps are not created (see the ignore rule below); only patch/minor are
    # opened, grouped above, and auto-merged by the auto-merge workflow.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10
    groups:
      pip-root-prod:
        dependency-type: "production"
        patterns:
          - "*"
      pip-root-dev:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/agentic-workflows-v2"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10
    groups:
      pip-runtime:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/agentic-v2-eval"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:45"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10
    groups:
      pip-eval:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/agentic-workflows-v2/ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 10
    groups:
      ui-npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 10
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Dependabot treats 3.11 -> 3.14 as a MINOR bump of the python image, so
      # the wildcard major-only rule above does not stop it. An interpreter bump
      # changes the ABI tag the image installs wheels for and has repeatedly
      # broken the release image (PRs #106, #158, #222: pinned zstandard/cffi
      # have no cp314 wheels, so pip source-builds and fails on slim). Bump the
      # base image deliberately, together with requires-python and the CI matrix.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
