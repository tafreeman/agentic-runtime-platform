version: 2

# Grouping: each ecosystem batches all of a week's minor/patch bumps into ONE
# pull request; a major bump is never folded into that grouped PR — it opens as
# its own ungrouped PR per package, per the major-version policy below. This
# collapses the ~16 individual PRs we used to get into ~5 grouped PRs, and
# avoids the pairwise lockfile conflicts that separate PRs cause (npm shares
# one package-lock.json; pip shares one uv.lock).
#
# Auto-merge (see .github/workflows/dependabot-auto-merge.yml): npm, github-actions
# and docker patch/minor PRs self-merge once the required checks pass. pip is
# deliberately NOT auto-merged — Dependabot does not regenerate uv.lock, so a pip
# PR must have its lock + ci-constraints.txt re-synced before merge (one grouped
# PR per directory, merged by hand — or via .github/workflows/dependabot-relock.yml,
# either its workflow_dispatch escape hatch or its scheduled job — after `uv lock`
# + re-export. Note that workflow uses plain `uv lock`, not `just relock`'s
# `uv lock --upgrade`: see the comment on its relock step for why (`--upgrade`
# turned a 3-package PR into 100). Regardless of ecosystem, a major-bump PR is
# NEVER auto-merged either: dependabot-auto-merge.yml's condition only matches
# `semver-patch`/`semver-minor` update-type, so allowing majors to open below
# does not change what can self-merge.
#
# pip-root is split by NAME PATTERN into pip-root-llm / pip-root-tooling /
# pip-root-rest. A dependency-type split was tried first and did not work: of
# the root directory's 84-plus tracked packages, only ~9 are dev tools and the
# bulk are transitive pins in ci-constraints.txt, which Dependabot classifies
# as production — so `dependency-type: production` re-bundled all 84 into one
# PR (#267, identical in size to the #261 it replaced). Runtime deps
# (anthropic, openai, langchain-core, pydantic, ...) carry real behavior risk
# and get their own PR; dev-tooling (pytest, ruff, mypy, black, pre-commit,
# ...) is lower-risk and reviewable at a glance separately. pip-runtime and
# pip-eval stay single groups — each is already small (3 and a handful of
# updates respectively).
#
# Major-version policy: every dependency below may now be proposed for a major
# bump EXCEPT `executionkit` and `agentic-evalkit`. Both are pre-1.0 packages
# whose private internals ARP reaches into directly (see the `ek` / `eval`
# extras in agentic-workflows-v2/pyproject.toml and ADR-023); their tight
# `>=0.3.0,<0.4.0` upper-bound pins are a deliberate compatibility contract,
# not neglect, and widening them must stay a conscious manual edit, never a
# Dependabot suggestion. They show up in two places — root, via the transitive
# pins ci-constraints.txt exports for the whole workspace, and
# agentic-workflows-v2, where the extras are declared — so both of those pip
# blocks carry a per-name ignore for the two packages instead of the old
# blanket wildcard.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    # Major bumps now open too (see the major-version policy at the top of this
    # file) — but as their own ungrouped PR per action, never folded into the
    # grouped patch/minor PR above, and dependabot-auto-merge.yml's
    # update-type check means a major here still always needs a human.

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10
    groups:
      # Order matters: Dependabot assigns each dependency to the FIRST group
      # whose patterns match, so the catch-all must stay last.
      pip-root-llm:
        patterns:
          - "anthropic*"
          - "openai*"
          - "langchain*"
          - "langgraph*"
          - "claude-agent-sdk*"
          - "google-genai*"
          - "mcp*"
          - "tiktoken*"
      pip-root-tooling:
        patterns:
          - "pytest*"
          - "ruff*"
          - "mypy*"
          - "black*"
          - "pre-commit*"
          - "coverage*"
          - "bandit*"
          - "isort*"
          - "docformatter*"
          - "detect-secrets*"
          - "fakeredis*"
          - "types-*"
      pip-root-rest:
        patterns:
          - "*"
    # executionkit and agentic-evalkit land in this directory too — not as
    # direct root dependencies, but as transitive pins that `uv export
    # --all-packages --all-extras` writes into root ci-constraints.txt (see
    # dependabot-relock.yml). Carve them out of major bumps per the
    # major-version policy at the top of this file; every other dependency
    # here, in whichever pip-root-* group it falls into above, is now free to
    # receive one.
    ignore:
      - dependency-name: "executionkit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "agentic-evalkit"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/agentic-workflows-v2"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10
    groups:
      pip-runtime:
        patterns:
          - "*"
    # executionkit (`ek` extra) and agentic-evalkit (`eval` extra) are declared
    # directly in this directory's pyproject.toml. See the major-version
    # policy at the top of this file: their tight upper-bound pins stay fully
    # enforced, so majors stay ignored for these two names specifically, while
    # every other dependency in this group is now free to receive one.
    ignore:
      - dependency-name: "executionkit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "agentic-evalkit"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/agentic-v2-eval"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:45"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10
    groups:
      pip-eval:
        patterns:
          - "*"
    # No executionkit/agentic-evalkit carve-out needed here — neither appears
    # in this directory's own pyproject.toml — so, per the major-version
    # policy at the top of this file, every dependency in this group is free
    # to receive a major-bump PR.

  - package-ecosystem: "npm"
    directory: "/agentic-workflows-v2/ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 10
    groups:
      ui-npm:
        patterns:
          - "*"
    # Per the major-version policy at the top of this file: no carve-out
    # applies to the npm ecosystem, so majors are now open here too.

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 10
    groups:
      docker:
        patterns:
          - "*"
    # Per the major-version policy at the top of this file: no carve-out
    # applies to the docker ecosystem, so majors are now open here too — this
    # is unrelated to, and does not loosen, the python-image rule below.
    ignore:
      # Dependabot treats 3.11 -> 3.14 as a MINOR bump of the python image, so a
      # major-only rule was never enough to stop it on its own. An interpreter
      # bump changes the ABI tag the image installs wheels for and has
      # repeatedly broken the release image (PRs #106, #158, #222: pinned
      # zstandard/cffi have no cp314 wheels, so pip source-builds and fails on
      # slim). Bump the base image deliberately, together with requires-python
      # and the CI matrix.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
