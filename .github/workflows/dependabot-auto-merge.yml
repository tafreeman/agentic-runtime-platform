name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge patch and minor updates immediately — these are safe to absorb.
      # Major version bumps are not created at all (dependabot.yml ignores them across
      # every ecosystem), so this step never sees a major update to merge.
      #
      # pip is deliberately excluded: Dependabot updates pyproject + ci-constraints.txt
      # but NOT uv.lock, so an auto-merged pip PR would land a stale lockfile and turn
      # the `ci-constraints.txt in sync with uv.lock` job red on main. pip PRs are
      # merged by hand after `just relock` (re-locks + regenerates ci-constraints.txt).
      - name: Auto-merge patch/minor updates (non-pip)
        if: >
          steps.meta.outputs.package-ecosystem != 'pip' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
