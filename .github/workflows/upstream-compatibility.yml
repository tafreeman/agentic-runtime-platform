name: Upstream compatibility

# Advisory only: no pull_request trigger and not a required shipping gate.
# Keep failures red so upstream breakage is visible to workflow subscribers.
on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-stable:
    name: Latest stable ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: executionkit
            module: executionkit
            tests: >-
              tests/engine/test_step_ek_delegation.py
              tests/engine/test_step_tool_path.py
              tests/models/test_ek_adapters.py
              tests/models/test_ek_provider.py
              tests/models/test_ek_provider_wrapper.py
          - package: agentic-evalkit
            module: agentic_evalkit
            tests: >-
              tests/test_evalkit_bridge.py
              tests/contract/test_evalkit_boundary.py
              tests/test_step_scoring_additional.py
    env:
      UPSTREAM_PACKAGE: ${{ matrix.package }}
      UPSTREAM_MODULE: ${{ matrix.module }}
      TEST_PATHS: ${{ matrix.tests }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install runtime and latest stable upstream
        # Do NOT request [ek] or [eval]: their shipping upper bounds would
        # prevent this probe from testing the next minor release even without
        # ci-constraints.txt. Normal PR jobs still enforce the shipping pins.
        # pip excludes prereleases by default; resolve transitive deps too.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e "agentic-workflows-v2/[dev,server,mcp,langchain,tracing]"
          python -m pip install -e "agentic-v2-eval/[dev]"
          python -m pip install --upgrade "$UPSTREAM_PACKAGE"
          python -m pip check
      - name: Record resolved environment
        if: always()
        run: python -m pip freeze --all > resolved-environment.txt
      - name: Verify upstream import and record version
        run: |
          python - <<'PY'
          import importlib
          import os
          from importlib.metadata import version

          importlib.import_module(os.environ["UPSTREAM_MODULE"])
          resolved = f'{os.environ["UPSTREAM_PACKAGE"]}=={version(os.environ["UPSTREAM_PACKAGE"])}'
          print(resolved)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Testing latest stable `{resolved}` outside shipping bounds.\n")
          PY
      - name: Run upstream contract suite
        working-directory: agentic-workflows-v2
        run: |
          set -euo pipefail
          read -r -a test_paths <<< "$TEST_PATHS"
          # Shipping pin conformance is tested in normal CI; this probe
          # deliberately tests API compatibility outside that version range.
          python -m pytest "${test_paths[@]}" -q --timeout=120 -rs \
            -k "not test_evalkit_version_satisfies_the_declared_pin" \
            --junitxml=../compatibility.xml
      - name: Reject silently skipped suites
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          cases = ET.parse("compatibility.xml").findall(".//testcase")
          if not cases or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Compatibility tests must execute; empty or skipped suites are not evidence.")
          PY
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.package }}
          path: |
            resolved-environment.txt
            compatibility.xml
          if-no-files-found: warn
