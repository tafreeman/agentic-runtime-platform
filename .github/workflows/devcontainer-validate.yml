name: Devcontainer Validate

# Builds and tests the devcontainer when relevant files change to ensure
# it remains functional for GitHub Codespaces and VS Code Dev Containers users.

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'agentic-workflows-v2/ui/package.json'
      - 'agentic-workflows-v2/ui/package-lock.json'

# Opt into Node.js 24 for JS-based actions.
# The Node 20 default is being removed from runners on 2026-09-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-devcontainer:
    name: Build and test devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and smoke test devcontainer
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            python -c "import agentic_v2; print('OK')"
