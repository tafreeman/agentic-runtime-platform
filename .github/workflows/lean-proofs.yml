name: Lean scheduler model and replay

# ADR-060: builds the Lean model of DAGExecutor in proofs/ and replays the
# real executor against its compiled spec. The build fails on `sorry`
# (warningAsError in proofs/lakefile.toml) or on a changed axiom set (the
# #guard_msgs pins in proofs/Scheduler.lean); axiom-audit below also checks
# every declaration in the library, pinned or not.

on:
  push:
    branches: [main, agenticv2]
    paths:
      - 'proofs/**'
      - 'agentic-workflows-v2/agentic_v2/engine/dag*.py'
      - 'agentic-workflows-v2/agentic_v2/engine/step.py'
      - 'agentic-workflows-v2/agentic_v2/engine/step_state.py'
      - 'agentic-workflows-v2/agentic_v2/contracts/messages.py'
      - 'agentic-workflows-v2/tests/engine/test_dag_executor_lean_replay.py'
      - 'agentic-workflows-v2/tests/engine/test_dag_executor_lean_exhaustive.py'
      - 'agentic-workflows-v2/tests/test_orchestrator_dag_differential.py'
      - 'agentic-workflows-v2/agentic_v2/agents/orchestrator*.py'
      - '.github/workflows/lean-proofs.yml'
  pull_request:
    branches: [main, agenticv2]
    paths:
      - 'proofs/**'
      - 'agentic-workflows-v2/agentic_v2/engine/dag*.py'
      - 'agentic-workflows-v2/agentic_v2/engine/step.py'
      - 'agentic-workflows-v2/agentic_v2/engine/step_state.py'
      - 'agentic-workflows-v2/agentic_v2/contracts/messages.py'
      - 'agentic-workflows-v2/tests/engine/test_dag_executor_lean_replay.py'
      - 'agentic-workflows-v2/tests/engine/test_dag_executor_lean_exhaustive.py'
      - 'agentic-workflows-v2/tests/test_orchestrator_dag_differential.py'
      - 'agentic-workflows-v2/agentic_v2/agents/orchestrator*.py'
      - '.github/workflows/lean-proofs.yml'

  # The n=4 exhaustive tier is too long for a PR; it runs nightly and on demand.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 60 }}
    env:
      ARP_LEAN_REPLAY: '1'
      AGENTIC_NO_LLM: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          leanchecker: 'true'
          # Without module names leanchecker guesses one from the package
          # name (Arp_scheduler) and fails to find any oleans.
          leanchecker-args: 'Scheduler Scheduler.Validate Main'
          axiom-audit: 'true'
          axiom-audit-allow: 'propext,Quot.sound'
          axiom-audit-root: 'Scheduler'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install packages as in ci.yml
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,mcp,langchain,tracing]" -c ci-constraints.txt
          pip install -e "agentic-v2-eval/[dev]" -c ci-constraints.txt
      - name: Replay the Python executor against Lean
        working-directory: agentic-workflows-v2
        run: python -m pytest tests/engine/test_dag_executor_lean_replay.py -q --timeout=120
      # Every plan of up to 3 steps against every legal completion order.
      - name: Replay every legal schedule of small plans against Lean
        working-directory: agentic-workflows-v2
        run: python -m pytest tests/engine/test_dag_executor_lean_exhaustive.py -q --timeout=120
      # Includes the orchestrator-versus-Lean validate cross-check, which skips
      # without ARP_LEAN_REPLAY.
      - name: Check the orchestrator's scheduler against DAGExecutor and Lean
        working-directory: agentic-workflows-v2
        run: python -m pytest tests/test_orchestrator_dag_differential.py -q --timeout=120
      - name: Replay every legal schedule of 4-step plans (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: agentic-workflows-v2
        env:
          ARP_LEAN_EXHAUSTIVE_MAX_STEPS: '4'
        run: python -m pytest tests/engine/test_dag_executor_lean_exhaustive.py -q --timeout=900
