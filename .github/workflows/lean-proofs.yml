name: Lean scheduler model and replay

# ADR-060: builds the Lean model of DAGExecutor in proofs/ and replays the
# real executor against its compiled spec. The build fails on `sorry`
# (warningAsError in proofs/lakefile.toml) or on a changed axiom set (the
# #guard_msgs pins in proofs/Scheduler.lean); axiom-audit below also checks
# every declaration in the library, pinned or not.

on:
  push:
    branches: [main]
    paths:
      - 'proofs/**'
      - 'agentic-workflows-v2/agentic_v2/engine/dag*.py'
      - 'agentic-workflows-v2/agentic_v2/engine/step.py'
      - 'agentic-workflows-v2/agentic_v2/engine/step_state.py'
      - 'agentic-workflows-v2/agentic_v2/contracts/messages.py'
      - 'agentic-workflows-v2/tests/engine/test_dag_executor_lean_replay.py'
      - 'agentic-workflows-v2/tests/engine/test_dag_executor_lean_exhaustive.py'
      - 'agentic-workflows-v2/tests/test_orchestrator_dag_differential.py'
      - 'agentic-workflows-v2/agentic_v2/agents/orchestrator*.py'
      - '.github/workflows/lean-proofs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'proofs/**'
      - 'agentic-workflows-v2/agentic_v2/engine/dag*.py'
      - 'agentic-workflows-v2/agentic_v2/engine/step.py'
      - 'agentic-workflows-v2/agentic_v2/engine/step_state.py'
      - 'agentic-workflows-v2/agentic_v2/contracts/messages.py'
      - 'agentic-workflows-v2/tests/engine/test_dag_executor_lean_replay.py'
      - 'agentic-workflows-v2/tests/engine/test_dag_executor_lean_exhaustive.py'
      - 'agentic-workflows-v2/tests/test_orchestrator_dag_differential.py'
      - 'agentic-workflows-v2/agentic_v2/agents/orchestrator*.py'
      - '.github/workflows/lean-proofs.yml'

  # The n=4 exhaustive tier is too long for a PR; it runs nightly and on demand.
  # The nightly run is skipped when main has not moved since the last successful
  # n=4 run (see the `nightly-gate` job); it is still forced at least weekly.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs: one group per PR number, newer push cancels the older run. Everything
  # else (push to main, schedule, dispatch): group per SHA, never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nightly-gate:
    # Scheduled runs only. Lean (pinned by lean-toolchain / lake-manifest) and
    # the replay are deterministic, so re-running n=4 on a commit that already
    # passed it tells us nothing new -- about a third of the nightly runs were
    # exactly that (main idle). Skip when the last SUCCESSFUL run of this workflow
    # on main that executed the n=4 tier (event schedule or workflow_dispatch)
    # tested this same SHA and is under MAX_AGE_DAYS old; the weekly refresh still
    # catches drift in the floating inputs (runner image, lean-action@v1,
    # pip-installed tooling). Fail OPEN: any API problem means "run". This is a
    # different trade-off from nightly.yml, where repeated same-SHA runs ARE the
    # measurement (flake rate), so that workflow is deliberately not gated.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: Has this commit already passed the n=4 tier recently?
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MAX_AGE_DAYS: "7"
        run: |
          set -uo pipefail
          skip=false
          if newest=$(gh api "repos/${GH_REPO}/actions/workflows/lean-proofs.yml/runs?branch=main&status=success&per_page=50" --jq '
              [.workflow_runs[]
               | select(.head_sha == env.SHA and (.event == "schedule" or .event == "workflow_dispatch"))
               | .created_at] | max // empty'); then
            if [ -n "$newest" ]; then
              age_days=$(( ( $(date -u +%s) - $(date -u -d "$newest" +%s) ) / 86400 ))
              if [ "$age_days" -lt "$MAX_AGE_DAYS" ]; then
                skip=true
                echo "Skipping: ${SHA:0:8} already passed the n=4 tier ${age_days}d ago (refresh after ${MAX_AGE_DAYS}d)."
              else
                echo "Running: last n=4 pass for ${SHA:0:8} is ${age_days}d old (>= ${MAX_AGE_DAYS}d refresh)."
              fi
            else
              echo "Running: no successful n=4 run recorded for ${SHA:0:8}."
            fi
          else
            echo "::warning::could not list workflow runs; running the nightly tier"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  lean-replay:
    # Not a required check. Runs for push/PR/dispatch always, and for the
    # nightly unless nightly-gate said skip. `!cancelled()` plus the empty-output
    # case (gate skipped on non-schedule events, or failed) means fail-open.
    needs: nightly-gate
    if: ${{ !cancelled() && needs.nightly-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 60 }}
    env:
      ARP_LEAN_REPLAY: '1'
      AGENTIC_NO_LLM: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          leanchecker: 'true'
          # Without module names leanchecker guesses one from the package
          # name (Arp_scheduler) and fails to find any oleans.
          leanchecker-args: 'Scheduler Scheduler.Validate Main'
          axiom-audit: 'true'
          axiom-audit-allow: 'propext,Quot.sound'
          axiom-audit-root: 'Scheduler'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install packages as in ci.yml
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,mcp,langchain,tracing]" -c ci-constraints.txt
          pip install -e "agentic-v2-eval/[dev]" -c ci-constraints.txt
      - name: Replay the Python executor against Lean
        working-directory: agentic-workflows-v2
        run: python -m pytest tests/engine/test_dag_executor_lean_replay.py -q --timeout=120
      # Every plan of up to 3 steps against every legal completion order.
      - name: Replay every legal schedule of small plans against Lean
        working-directory: agentic-workflows-v2
        run: python -m pytest tests/engine/test_dag_executor_lean_exhaustive.py -q --timeout=120
      # Includes the orchestrator-versus-Lean validate cross-check, which skips
      # without ARP_LEAN_REPLAY.
      - name: Check the orchestrator's scheduler against DAGExecutor and Lean
        working-directory: agentic-workflows-v2
        run: python -m pytest tests/test_orchestrator_dag_differential.py -q --timeout=120
      - name: Replay every legal schedule of 4-step plans (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: agentic-workflows-v2
        env:
          ARP_LEAN_EXHAUSTIVE_MAX_STEPS: '4'
        run: python -m pytest tests/engine/test_dag_executor_lean_exhaustive.py -q --timeout=900
