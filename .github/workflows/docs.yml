name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # required for mkdocs git-revision-date-localized

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Cairo (required by mkdocs-material social plugin)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango-1.0-0 libpangocairo-1.0-0

      - name: Install MkDocs + plugins
        run: |
          pip install \
            "mkdocs-material[imaging]" \
            mkdocs-mermaid2-plugin \
            mkdocs-git-revision-date-localized-plugin \
            pillow \
            cairosvg

      - name: Sync CONTRIBUTING.md into docs/ (rewrite repo-root paths)
        run: |
          python <<'PY'
          import re, pathlib
          src = pathlib.Path("CONTRIBUTING.md").read_text(encoding="utf-8")
          repo = "https://github.com/tafreeman/agentic-runtime-platform/blob/main"
          # Strip 'docs/' prefix — these files live as siblings inside docs/
          text = re.sub(r"\(docs/", "(", src)
          # Rewrite repo-root file references to GitHub URLs
          for path in [
              "agentic-workflows-v2/CONTRIBUTING.md",
              "agentic-workflows-v2/SECURITY.md",
              "README.md",
              "SUPPORT.md",
              ".env.example",
          ]:
              text = text.replace(f"]({path})", f"]({repo}/{path})")
          text = text.replace("](.github/workflows/)", f"]({repo}/.github/workflows/)")
          text = text.replace("](docs/adr/)", f"]({repo}/docs/adr/)")
          pathlib.Path("docs/CONTRIBUTING.md").write_text(text, encoding="utf-8")
          PY

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Deploy
        run: mkdocs gh-deploy --force
