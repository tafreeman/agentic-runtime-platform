name: Deploy docs to GitHub Pages

# The ONE publisher of the Pages site. It also regenerates and verifies the
# k6-derived load report (docs/load-report.md) from the committed
# load/results/*.json, so the published page is always a pure function of the
# measurement data. (This used to be a separate load-report-pages.yml; two
# workflows both ending in `mkdocs gh-deploy --force` raced each other and
# produced different CONTRIBUTING pages depending on which finished last.)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"                        # includes docs/load-report.md and docs/flagship.md
      - "mkdocs.yml"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "load/results/**"
      - "scripts/build_load_report.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One serialized Pages publisher; queued runs collapse to the newest, so the
  # last deploy is always the latest main. Never cancel: killing `gh-deploy`
  # mid-push risks a half-updated gh-pages branch.
  group: pages-gh-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # required for mkdocs git-revision-date-localized

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      # The page must be a pure function of committed k6 JSON (no hand edits).
      # Runs before the apt/pip work so a drifted page fails cheaply. The diff is
      # scoped to the generated file, so the CONTRIBUTING sync below cannot
      # affect it. The drift check now gates every docs deploy: a drifted
      # docs/load-report.md blocks docs publishing until it is regenerated.
      - name: Verify load-report is in sync with committed k6 JSON
        run: |
          python scripts/build_load_report.py
          if ! git diff --quiet -- docs/load-report.md; then
            echo "::error::docs/load-report.md is out of date with load/results/*.json."
            echo "Run 'python scripts/build_load_report.py' and commit the result."
            git --no-pager diff -- docs/load-report.md
            exit 1
          fi

      - name: Install Cairo (required by mkdocs-material social plugin)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango-1.0-0 libpangocairo-1.0-0

      - name: Install MkDocs + plugins
        run: |
          pip install \
            "mkdocs-material[imaging]" \
            mkdocs-mermaid2-plugin \
            mkdocs-git-revision-date-localized-plugin \
            pillow \
            cairosvg

      - name: Sync CONTRIBUTING.md into docs/ (rewrite repo-root paths)
        run: |
          python <<'PY'
          import re, pathlib
          src = pathlib.Path("CONTRIBUTING.md").read_text(encoding="utf-8")
          repo = "https://github.com/tafreeman/agentic-runtime-platform/blob/main"
          # Strip 'docs/' prefix — these files live as siblings inside docs/
          text = re.sub(r"\(docs/", "(", src)
          # Rewrite repo-root file references to GitHub URLs
          for path in [
              "agentic-workflows-v2/CONTRIBUTING.md",
              "agentic-workflows-v2/SECURITY.md",
              "README.md",
              "SUPPORT.md",
              ".env.example",
          ]:
              text = text.replace(f"]({path})", f"]({repo}/{path})")
          text = text.replace("](.github/workflows/)", f"]({repo}/.github/workflows/)")
          text = text.replace("](docs/adr/)", f"]({repo}/docs/adr/)")
          pathlib.Path("docs/CONTRIBUTING.md").write_text(text, encoding="utf-8")
          PY

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Deploy
        run: mkdocs gh-deploy --force
