# CodeQL SAST analysis for Python and TypeScript. Results appear in GitHub Security tab →
# Code scanning alerts. Free for public repositories. Implements NIST SP 800-218 SSDF
# PW.7.1 (use automated testing for vulnerabilities).
#
# REQUIRED status checks on main: "Analyze (python)" and "Analyze (javascript-typescript)".
# Never add workflow-level `paths:` / `paths-ignore:` to this workflow, and never
# give the matrix job a job-level `if:` -- either leaves the required contexts at
# "Expected" (a skipped matrix job reports its UNEXPANDED name). Docs-only PRs are
# handled by gating the expensive STEPS instead, so the job always reports.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2am UTC

concurrency:
  # PRs: one group per PR number, newer push cancels the older run. Everything
  # else (push to main, schedule): group per run, never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      # PR-only scope check. The job ALWAYS runs so both required contexts
      # always report; only the expensive steps are skipped, and only when every
      # changed file is something CodeQL can never read (markdown, images,
      # LICENSE, issue templates, Lean proofs). docs/** is deliberately NOT
      # ignored: it holds .html and .json files the JS extractor reads.
      # continue-on-error => on any API failure the output is empty and the
      # analysis RUNS (fail-open to analyzing). Push and schedule runs skip this
      # step, so their outputs are empty and everything runs.
      - name: Detect PRs CodeQL cannot be affected by
        id: scope
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            analyzable:
              - '**'
              - '!**/*.md'
              - '!**/*.png'
              - '!**/*.jpg'
              - '!**/*.jpeg'
              - '!**/*.gif'
              - '!LICENSE'
              - '!proofs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
              - '!.github/CODEOWNERS'

      - name: Checkout repository
        if: steps.scope.outputs.analyzable != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        if: steps.scope.outputs.analyzable != 'false'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: steps.scope.outputs.analyzable != 'false'
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1

      - name: Perform CodeQL Analysis
        if: steps.scope.outputs.analyzable != 'false'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
