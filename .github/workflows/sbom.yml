# Generates CycloneDX SBOMs for all packages. Implements EO 14028 §4 (software supply chain security) and NIST SP 800-218 SSDF PW.4.2.

name: SBOM Generation

on:
  # SBOMs track released artifacts, so generate them on publish rather than on
  # every push to main. A weekly run keeps main covered between releases.
  release:
    types: [published]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  workflow_dispatch:

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev]" -c ci-constraints.txt
          pip install -e "agentic-v2-eval/[dev]" -c ci-constraints.txt

      - name: Install cyclonedx-bom
        run: pip install cyclonedx-bom

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate Python SBOM
        run: cyclonedx-py environment --output-format XML --output-file sbom/python-sbom.xml

      - name: Install Node UI dependencies
        working-directory: agentic-workflows-v2/ui
        run: npm ci

      - name: Generate Node SBOM
        working-directory: agentic-workflows-v2/ui
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format XML \
            --output-file ../../sbom/node-sbom.xml \
          || {
            echo "npx @cyclonedx/cyclonedx-npm failed — falling back to package-lock.json artifact"
            cp package-lock.json ../../sbom/node-package-lock.json
          }

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          retention-days: 90
