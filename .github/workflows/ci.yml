name: CI

# CI: verifies Python imports + smoke tests, frontend build, ruff lint, strict
# mypy on the core runtime surface, and the 80% coverage gate.
# Integration and slow tests are excluded from the fast CI pass.

on:
  push:
    branches: [main, agenticv2]
  pull_request:
    branches: [main, agenticv2]

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,mcp,langchain,tracing]" -c ci-constraints.txt
          pip install -e "agentic-v2-eval/[dev]" -c ci-constraints.txt
      - name: Verify critical imports
        run: |
          python -c "
          import agentic_v2
          from agentic_v2.core.protocols import AgentProtocol, ToolProtocol, ExecutionEngine
          from agentic_v2.workflows import WorkflowLoader
          print('Critical imports OK')
          "
      - name: Pytest smoke (unit only)
        # pipefail is NOT the default for workflow `run:` steps (only an
        # explicit `shell: bash` opts in), so without it the `| tail` pipe
        # swallows pytest's exit code and a red suite reports green.
        run: |
          set -euo pipefail
          cd agentic-workflows-v2
          python -m pytest tests/ -q \
            -m "not integration and not slow" \
            --ignore=tests/e2e \
            -x --timeout=120 2>&1 | tail -30

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agentic-workflows-v2/ui/package-lock.json
      - name: Install and build UI
        run: |
          cd agentic-workflows-v2/ui
          npm ci
          npm run build

  frontend-test:
    # UI unit tests + vitest coverage gate. The floors live in
    # agentic-workflows-v2/ui/vitest.config.ts (`test.coverage.thresholds`);
    # `npm run test:coverage` fails the job if any metric drops below its floor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agentic-workflows-v2/ui/package-lock.json
      - name: Install UI dependencies
        run: |
          cd agentic-workflows-v2/ui
          npm ci
      - name: Run UI tests with coverage
        run: |
          cd agentic-workflows-v2/ui
          npm run test:coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "agentic-workflows-v2/[dev]" -c ci-constraints.txt
      - name: Ruff lint (blocking)
        shell: bash
        run: |
          cd agentic-workflows-v2
          python -m ruff check --show-fixes agentic_v2/ tests/
      - name: Check for unfixed autofixes
        shell: bash
        run: |
          cd agentic-workflows-v2
          python -m ruff check --fix --show-fixes agentic_v2/ tests/
          if ! git diff --quiet -- agentic_v2/ tests/; then
            echo "::error::Ruff applied autofixes. Run 'ruff check --fix agentic_v2/ tests/' locally and commit the result."
            exit 1
          fi

  suppression-ratchet:
    # ARP-9: prevents the ruff `ignore` list, `per-file-ignores`, and mypy
    # `ignore_errors` overrides in pyproject.toml from silently growing.
    # Counts may shrink freely; a PR that adds a new suppression beyond the
    # committed baseline (agentic-workflows-v2/.ruff-suppression-baseline.json)
    # fails here. Uses only the stdlib (tomllib/json/argparse), so no package
    # install is required.
    name: Suppression ratchet (ruff ignores + mypy overrides)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check suppression counts against committed baseline
        run: |
          cd agentic-workflows-v2
          python scripts/check_suppression_ratchet.py

  typecheck-core-contracts:
    name: Mypy (strict engine + contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "agentic-workflows-v2/[dev]" -c ci-constraints.txt
      - name: Run strict mypy ratchet
        run: |
          cd agentic-workflows-v2
          python -m mypy agentic_v2/engine agentic_v2/contracts \
            --config-file pyproject.toml \
            --follow-imports=skip \
            --disallow-untyped-defs \
            --warn-return-any \
            --show-error-codes \
            --no-incremental

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          # Install the repo-root agentic-tools package first so tests that
          # `from tools...` resolve. Then install the runtime with langchain
          # + tracing extras so adapter validation and tracing tests both run.
          pip install -e . -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,mcp,langchain,tracing]" -c ci-constraints.txt
      - name: Run tests with coverage
        # pytest-cov 7.x prints `FAIL Required test coverage of N% not reached`
        # but does not propagate a non-zero exit when the test session passed,
        # which can leave a sub-threshold coverage run inside a green CI job.
        # We therefore collect coverage here without `--cov-fail-under` and
        # enforce the gate explicitly in the next step via `coverage report
        # --fail-under=80`, which is guaranteed to exit non-zero when below.
        run: |
          cd agentic-workflows-v2
          python -m pytest tests/ -q \
            -m "not integration and not slow" \
            --cov=agentic_v2 \
            --cov-report=term-missing
      - name: Enforce 80% coverage gate
        run: |
          cd agentic-workflows-v2
          python -m coverage report --fail-under=80
      - name: Report whole-repo coverage (visibility only)
        if: success() || failure()
        run: |
          pip install -e "agentic-v2-eval/[dev]" -c ci-constraints.txt
          COVERAGE_FILE=.coverage-whole-repo python -m pytest \
            agentic-workflows-v2/tests \
            agentic-v2-eval/tests \
            -q \
            -m "not integration and not slow" \
            --ignore=agentic-workflows-v2/tests/e2e \
            --cov=agentic-workflows-v2/agentic_v2 \
            --cov=agentic-v2-eval/src/agentic_v2_eval \
            --cov=tools \
            --cov-config=/dev/null \
            --cov-report=term-missing \
            --cov-report=xml:coverage-whole-repo.xml
      - name: Upload whole-repo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: whole-repo-coverage
          path: coverage-whole-repo.xml
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage-whole-repo.xml
          fail_ci_if_error: false

  claude-subscription-tests:
    # The subscription-authenticated Claude surfaces (agentic_v2/models/
    # backends_claude.py and the ClaudeSDKAgent wrapper) are gated on the
    # optional `claude` extra, which no other job installs -- every other job
    # installs dev,server,mcp,langchain,tracing. Their tests therefore
    # importorskip themselves everywhere else, exactly the blind spot that let
    # an ADR-047 regression through on the EK side. This job installs the extra
    # so the suite actually runs.
    #
    # The last two files are pre-existing and were already skipping in every
    # job for the same reason -- `tests/integrations/mcp/` is a package whose
    # parent is not, so pytest puts `tests/integrations/` on sys.path and
    # `import mcp` then resolves to that directory instead of the installed
    # distribution, which makes `import claude_agent_sdk` fail. Running the
    # files alone avoids collecting that directory at all, so 15 tests that
    # have never actually executed in CI now do.
    #
    # No CLI, sign-in, or network needed: the tests monkeypatch `query` and
    # replay the SDK's own message dataclasses.
    name: Claude subscription backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages (with the claude extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,mcp,langchain,tracing,claude]" -c ci-constraints.txt
      - name: Verify claude-agent-sdk is importable
        # Guard against the silent-skip failure mode this job exists to close:
        # if the claude extra ever fails to resolve, fail loudly here rather
        # than let the tests below quietly skip and report green.
        run: |
          python -c "import claude_agent_sdk; print('claude-agent-sdk', getattr(claude_agent_sdk, '__version__', '?'))"
      - name: Run the claude-gated suite
        run: |
          set -euo pipefail
          cd agentic-workflows-v2
          python -m pytest             tests/models/test_backends_claude.py             tests/test_claude_sdk_agent.py             tests/test_sdk_task_orchestrator_example.py             tests/test_implementations_sanitization.py             -q --timeout=120 -rs

  ek-delegation-tests:
    # The EK bridge suite (tests/engine/test_step_ek_*, tests/models/test_ek_*)
    # module-skips itself when `executionkit` is not importable, and no other
    # CI job installs the optional `ek` extra — so those tests, including the
    # ADR-047 approval-gate regressions (a non-BaseTool runtime tool must be
    # denied / fail-closed), SKIP in every other job. That blind spot let an
    # ADR-047 regression pass CI (caught only by manual review). This job
    # installs the `ek` extra so the suite actually runs.
    name: EK step-delegation (approval-gate) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages (with the ek extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,mcp,langchain,tracing,ek]" -c ci-constraints.txt
      - name: Verify executionkit is importable
        # Guard against the silent-skip failure mode this job exists to close:
        # if the ek extra ever fails to resolve/install, fail loudly here rather
        # than let the tests below quietly module-skip and report green.
        run: |
          python -c "import executionkit; print('executionkit', getattr(executionkit, '__version__', '?'))"
      - name: Run the EK-gated suite
        run: |
          set -euo pipefail
          cd agentic-workflows-v2
          python -m pytest \
            tests/engine/test_step_ek_delegation.py \
            tests/engine/test_step_tool_path.py \
            tests/models/test_ek_adapters.py \
            tests/models/test_ek_provider.py \
            tests/models/test_ek_provider_wrapper.py \
            -q --timeout=120

  evalkit-bridge-tests:
    # Same blind spot as ek-delegation-tests, for the other optional extra.
    # tests/test_evalkit_bridge.py and tests/contract/test_evalkit_boundary.py
    # both `importorskip` agentic_evalkit, and no other job installs the `eval`
    # extra — so the bridge that adapts EVK's Rubric/RubricCriterion/
    # CallableTarget into ARP has never actually been exercised in CI. An EVK
    # rename would surface only on a dev machine. This job installs the extra
    # so the bridge runs.
    name: EvalKit bridge (eval extra) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages (with the eval extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,mcp,langchain,tracing,eval]" -c ci-constraints.txt
          # tests/test_evalkit_bridge.py imports agentic_v2_eval (the in-tree
          # legacy eval package). Without this the job dies at COLLECTION with
          # ModuleNotFoundError, not on an assertion.
          pip install -e "agentic-v2-eval/[dev]" -c ci-constraints.txt
      - name: Verify agentic_evalkit is importable
        # Fail loudly if the extra stops resolving, rather than letting the
        # tests below quietly importorskip and report green.
        run: |
          python -c "import agentic_evalkit; print('agentic-evalkit', getattr(agentic_evalkit, '__version__', '?'))"
      - name: Run the EvalKit-gated suite
        run: |
          set -euo pipefail
          cd agentic-workflows-v2
          python -m pytest \
            tests/test_evalkit_bridge.py \
            tests/contract/test_evalkit_boundary.py \
            -q --timeout=120

  wire-format-drift:
    # Sprint B #3 / S1-1 — prevent silent Python <-> TypeScript wire-format drift.
    # Sources of truth:
    #   agentic_v2/contracts/events.py              → events.schema.json + events.generated.ts
    #   agentic_v2/server/models.StepResultRecord   → step_result.schema.json + step_result.generated.ts
    #   agentic_v2/server/models.DAGResponse        → dag_response.schema.json + dag_response.generated.ts
    #   agentic_v2/server/models.WorkflowInputSchemaResponse → workflow_input_schema.schema.json + workflow_input_schema.generated.ts
    #   agentic_v2/server/models.WorkflowEditorStep → workflow_editor_step.schema.json + workflow_editor_step.generated.ts
    #   agentic_v2/server/models.RunsSummaryResponse → runs_summary.schema.json + runs_summary.generated.ts
    #   agentic_v2/contracts/chat.py (ChatRequest)  → chat_request.schema.json + chat_request.generated.ts
    #   agentic_v2/contracts/chat.py (ChatStreamEvent) → chat_stream_event.schema.json + chat_stream_event.generated.ts
    # This job regenerates all committed artifacts and fails the PR if the
    # working tree no longer matches what's checked in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agentic-workflows-v2/ui/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "agentic-workflows-v2/[dev,server]" -c ci-constraints.txt
      - name: Install UI
        run: |
          cd agentic-workflows-v2/ui
          npm ci
      - name: Regenerate execution event schema
        run: |
          cd agentic-workflows-v2
          python -m scripts.generate_ts_types
      - name: Regenerate TypeScript types
        run: |
          cd agentic-workflows-v2/ui
          npm run generate:types
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- \
              agentic-workflows-v2/tests/schemas/events.schema.json \
              agentic-workflows-v2/tests/schemas/step_result.schema.json \
              agentic-workflows-v2/tests/schemas/dag_response.schema.json \
              agentic-workflows-v2/tests/schemas/workflow_input_schema.schema.json \
              agentic-workflows-v2/tests/schemas/workflow_editor_step.schema.json \
              agentic-workflows-v2/tests/schemas/runs_summary.schema.json \
              agentic-workflows-v2/tests/schemas/chat_request.schema.json \
              agentic-workflows-v2/tests/schemas/chat_stream_event.schema.json \
              agentic-workflows-v2/ui/src/api/events.generated.ts \
              agentic-workflows-v2/ui/src/api/step_result.generated.ts \
              agentic-workflows-v2/ui/src/api/dag_response.generated.ts \
              agentic-workflows-v2/ui/src/api/workflow_input_schema.generated.ts \
              agentic-workflows-v2/ui/src/api/workflow_editor_step.generated.ts \
              agentic-workflows-v2/ui/src/api/runs_summary.generated.ts \
              agentic-workflows-v2/ui/src/api/chat_request.generated.ts \
              agentic-workflows-v2/ui/src/api/chat_stream_event.generated.ts; then
            echo "::error::Wire-format drift detected. Run 'python -m scripts.generate_ts_types' and 'npm run generate:types' (from agentic-workflows-v2/ui/) and commit the result."
            exit 1
          fi

  e2e-streaming:
    # Epic 2 Story 2.2 — Playwright streaming PR gate.
    # Runs the streaming spec 5× to catch flakes early. The rolling nightly
    # 50× job (Story 2.4) measures the long-term flake rate.
    #
    # Uses AGENTIC_NO_LLM=1 so the backend spawns PlaceholderChatModel for
    # all tier-1/tier-2 agents. This eliminates GitHub Models rate-limit
    # failures on back-to-back runs (429 → 41 s retry > 30 s Playwright
    # timeout) while still exercising the full streaming + reconnect path.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agentic-workflows-v2/ui/package-lock.json
      - name: Install backend (server extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,langchain]" -c ci-constraints.txt
      - name: Install UI + Playwright
        run: |
          cd agentic-workflows-v2/ui
          npm ci
          npx playwright install --with-deps chromium
      - name: Run streaming E2E 5×
        env:
          AGENTIC_NO_LLM: "1"
        run: |
          cd agentic-workflows-v2/ui
          npm run test:e2e:5x
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            agentic-workflows-v2/ui/test-results/
            agentic-workflows-v2/ui/playwright-report/
            agentic-workflows-v2/ui/e2e-results.json
          retention-days: 14
          if-no-files-found: ignore

  no-llm-smoke:
    # SB-2: runs the full unit suite with AGENTIC_NO_LLM=1 and zero API keys.
    # Contributors without provider credentials can use this job as their local CI baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,langchain]" -c ci-constraints.txt
      - name: Validate deterministic workflow
        env:
          AGENTIC_NO_LLM: "1"
        run: |
          cd agentic-workflows-v2
          agentic validate test_deterministic
      - name: Run deterministic workflow end-to-end
        env:
          AGENTIC_NO_LLM: "1"
        run: |
          cd agentic-workflows-v2
          agentic run test_deterministic --input tests/fixtures/deterministic_input.json
      - name: Run no-LLM LangChain tests
        env:
          AGENTIC_NO_LLM: "1"
        run: |
          cd agentic-workflows-v2
          python -m pytest tests/langchain/test_no_llm_mode_langchain.py -q
      - name: Run unit tests (no API keys)
        env:
          AGENTIC_NO_LLM: "1"
        # pipefail is NOT the default for workflow `run:` steps (only an
        # explicit `shell: bash` opts in), so without it the `| tail` pipe
        # swallows pytest's exit code and a red suite reports green.
        run: |
          set -euo pipefail
          cd agentic-workflows-v2
          python -m pytest tests/ -q \
            -m "not integration and not slow" \
            --ignore=tests/e2e \
            -x --timeout=120 2>&1 | tail -30

  # ── Documentation & schema quality gates (merged from doc-drift.yml) ──────
  # Cheap, high-signal checks; each completes in well under 30s on a warm runner.
  validate-workflows:
    name: Validate workflow YAMLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema
      - name: Validate workflow YAML definitions
        run: python scripts/validate-workflows.py

  check-doc-drift:
    name: Protocol ↔ ARCHITECTURE.md drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check protocol names appear in ARCHITECTURE.md
        run: python scripts/check-doc-drift.py

  doc-stats-drift:
    # Fail the build if docs/index.md's derived "by the numbers" stats (backend
    # test count, ADR count, production workflow count) no longer match what
    # scripts/generate_doc_stats.py recomputes from source. Keeps the homepage
    # figures from silently drifting — regenerate with
    # `python scripts/generate_doc_stats.py` and commit. Stdlib-only, so no
    # dependency install step is needed (mirrors check-doc-drift above).
    name: docs/index.md derived stats in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check homepage stats match source
        run: python scripts/generate_doc_stats.py --check

  pydocstyle:
    name: pydocstyle (core + contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pydocstyle
        run: |
          python -m pip install --upgrade pip
          pip install pydocstyle
      - name: Run pydocstyle on core/
        run: |
          pydocstyle \
            --convention=google \
            --add-ignore=D100,D104 \
            agentic-workflows-v2/agentic_v2/core/
      - name: Run pydocstyle on contracts/
        # D101: missing docstring in public class — Pydantic model classes
        # routinely skip class-level docstrings in favour of field-level
        # documentation.  Enforce only function/method docstrings here.
        run: |
          pydocstyle \
            --convention=google \
            --add-ignore=D100,D101,D104 \
            agentic-workflows-v2/agentic_v2/contracts/

  lockfile-constraints:
    # Reproducible installs: every Python job installs with
    # `-c ci-constraints.txt`, a pip constraints file derived from uv.lock so
    # transitive versions match the lock instead of resolving latest. This job
    # keeps uv.lock the single source of truth by regenerating the file and
    # failing on drift (mirrors the wire-format-drift gate). Without it, the
    # committed constraints could silently lag the lock.
    name: ci-constraints.txt in sync with uv.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Regenerate constraints from uv.lock
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.11.2"
          uv export --locked --no-hashes --no-emit-workspace \
            --all-packages --all-extras -o ci-constraints.txt
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- ci-constraints.txt; then
            echo "::error::ci-constraints.txt is out of sync with uv.lock. Regenerate with 'uv export --locked --no-hashes --no-emit-workspace --all-packages --all-extras -o ci-constraints.txt' and commit the result."
            exit 1
          fi

  dockerfile-constraints:
    # Reproducible Docker builds: every `pip install` in the Dockerfile must
    # pin to `-c ci-constraints.txt` (see lockfile-constraints above), or two
    # builds of the same commit can resolve different transitive dependency
    # versions. This job fails if any real `pip install` line in the
    # Dockerfile omits the constraints file.
    name: Dockerfile pip installs pin to ci-constraints.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify every pip install pins ci-constraints.txt
        shell: bash
        run: |
          set -euo pipefail
          dockerfile="Dockerfile"
          failed=0
          while IFS= read -r line; do
            if [[ "$line" == *"pip install"* ]] && [[ "$line" != *"--upgrade pip"* ]]; then
              if ! [[ "$line" =~ -c[[:space:]]+ci-constraints\.txt ]]; then
                echo "::error::Dockerfile pip install line missing '-c ci-constraints.txt': ${line}"
                failed=1
              fi
            fi
          done < "$dockerfile"
          if [[ "$failed" -eq 1 ]]; then
            echo "One or more 'pip install' lines in $dockerfile do not pin to ci-constraints.txt. Add '-c ci-constraints.txt' to each (except the 'pip install --upgrade pip' bootstrap line)."
            exit 1
          fi
          echo "All pip install lines in $dockerfile reference ci-constraints.txt."

  rag-extra-tests:
    # The `rag` extra (lancedb, litellm) is installed by no other job, so the
    # LanceDB path is proven only against fakes: tests/test_vectorstore_lancedb.py
    # `importorskip`s lancedb and therefore SKIPS everywhere while the run stays
    # green. This is the job docs/KNOWN_LIMITATIONS.md §4.6 specifies as the
    # upstream fix.
    #
    # Deliberately non-blocking (continue-on-error), exactly as §4.6 prescribes:
    # the extra pulls a large dependency tree, and a resolution failure in a
    # heavy optional extra should not block an unrelated PR. Promote it to
    # required once it has a stable history.
    name: RAG extra (lancedb/litellm) tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages (with the rag extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,rag]" -c ci-constraints.txt
      - name: Verify lancedb and litellm are importable
        # Guard the silent-skip failure mode this job exists to close: if the
        # extra stops resolving, fail here rather than let the suite below
        # importorskip its way to a green run.
        run: |
          python -c "import lancedb, litellm; print('lancedb', lancedb.__version__)"
      - name: Run the RAG suites against the real backends
        run: |
          set -euo pipefail
          cd agentic-workflows-v2
          python -m pytest \
            tests/test_rag_embeddings_litellm.py \
            tests/test_rag_factory.py \
            tests/test_vectorstore_lancedb.py \
            -q --timeout=300

  tools-tests:
    # tools/tests holds 17 files that NO job has ever collected: the whole-repo
    # coverage step measures --cov=tools but only collects agentic-workflows-v2
    # and agentic-v2-eval. So tools/ was measured but never exercised, and the
    # redaction tests guarding the clear-text CodeQL fixes would never run.
    #
    # 11 tests are deselected below. They are not flaky — they are stale, and
    # they are stale *because* nothing ever ran them: they assert an API that no
    # longer exists (classify_error() lost its return_code parameter;
    # evaluation_pipeline lost print_evaluation_report, which the mocks patch).
    # They are listed individually rather than excluded by file so the debt is
    # greppable and the surviving tests in those same files still gate. Fixing
    # them is tracked in docs/KNOWN_LIMITATIONS.md.
    name: tools/ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev]" -c ci-constraints.txt
      - name: Run the tools suite
        run: |
          set -euo pipefail
          python -m pytest tools/tests -q --timeout=120 \
            --deselect tools/tests/test_errors.py::TestClassifyError::test_return_code_param_accepted \
            --deselect tools/tests/test_benchmark_pipeline.py::TestEvaluateTaskOutputLlm::test_successful_evaluation \
            --deselect tools/tests/test_benchmark_pipeline.py::TestEvaluateTaskOutputLlm::test_saves_report_when_output_dir \
            --deselect tools/tests/test_benchmark_pipeline.py::TestEvaluateTaskOutputLlm::test_creates_minimal_gold_when_none_found \
            --deselect tools/tests/test_evaluation_pipeline.py::TestEvaluateTaskOutputLlm::test_creates_minimal_gold_data_when_none_found \
            --deselect tools/tests/test_evaluation_pipeline.py::TestEvaluateTaskOutputLlm::test_uses_existing_gold_data_when_found \
            --deselect tools/tests/test_evaluation_pipeline.py::TestEvaluateTaskOutputLlm::test_returns_eval_dict \
            --deselect tools/tests/test_evaluation_pipeline.py::TestEvaluateTaskOutputLlm::test_saves_report_when_output_dir_given \
            --deselect tools/tests/test_evaluation_pipeline.py::TestEvaluateTaskOutputLlm::test_does_not_save_report_when_output_dir_none \
            --deselect tools/tests/test_evaluation_pipeline.py::TestEvaluateTaskOutputLlm::test_verbose_calls_print_evaluation_report \
            --deselect tools/tests/test_evaluation_pipeline.py::TestEvaluateTaskOutputLlm::test_passes_evaluator_model_to_evaluate_with_llm
