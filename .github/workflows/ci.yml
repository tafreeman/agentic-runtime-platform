name: CI

# CI: verifies Python imports + smoke tests, frontend build, ruff lint, strict
# mypy on the core runtime surface, and the 80% coverage gate.
# Integration and slow tests are excluded from the fast CI pass.

on:
  push:
    branches: [main, agenticv2]
  pull_request:
    branches: [main, agenticv2]

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,mcp,langchain,tracing]" -c ci-constraints.txt
          pip install -e "agentic-v2-eval/[dev]" -c ci-constraints.txt
      - name: Verify critical imports
        run: |
          python -c "
          import agentic_v2
          from agentic_v2.core.protocols import AgentProtocol, ToolProtocol, ExecutionEngine
          from agentic_v2.workflows import WorkflowLoader
          print('Critical imports OK')
          "
      - name: Pytest smoke (unit only)
        run: |
          cd agentic-workflows-v2
          python -m pytest tests/ -q \
            -m "not integration and not slow" \
            --ignore=tests/e2e \
            -x --timeout=120 2>&1 | tail -30

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agentic-workflows-v2/ui/package-lock.json
      - name: Install and build UI
        run: |
          cd agentic-workflows-v2/ui
          npm ci
          npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "agentic-workflows-v2/[dev]" -c ci-constraints.txt
      - name: Ruff lint (blocking)
        shell: bash
        run: |
          cd agentic-workflows-v2
          python -m ruff check --show-fixes agentic_v2/ tests/
      - name: Check for unfixed autofixes
        shell: bash
        run: |
          cd agentic-workflows-v2
          python -m ruff check --fix --show-fixes agentic_v2/ tests/
          if ! git diff --quiet -- agentic_v2/ tests/; then
            echo "::error::Ruff applied autofixes. Run 'ruff check --fix agentic_v2/ tests/' locally and commit the result."
            exit 1
          fi

  suppression-ratchet:
    # ARP-9: prevents the ruff `ignore` list, `per-file-ignores`, and mypy
    # `ignore_errors` overrides in pyproject.toml from silently growing.
    # Counts may shrink freely; a PR that adds a new suppression beyond the
    # committed baseline (agentic-workflows-v2/.ruff-suppression-baseline.json)
    # fails here. Uses only the stdlib (tomllib/json/argparse), so no package
    # install is required.
    name: Suppression ratchet (ruff ignores + mypy overrides)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check suppression counts against committed baseline
        run: |
          cd agentic-workflows-v2
          python scripts/check_suppression_ratchet.py

  typecheck-core-contracts:
    name: Mypy (strict engine + contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "agentic-workflows-v2/[dev]" -c ci-constraints.txt
      - name: Run strict mypy ratchet
        run: |
          cd agentic-workflows-v2
          python -m mypy agentic_v2/engine agentic_v2/contracts \
            --config-file pyproject.toml \
            --follow-imports=skip \
            --disallow-untyped-defs \
            --warn-return-any \
            --show-error-codes \
            --no-incremental

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          # Install the repo-root agentic-tools package first so tests that
          # `from tools...` resolve. Then install the runtime with langchain
          # + tracing extras so adapter validation and tracing tests both run.
          pip install -e . -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,mcp,langchain,tracing]" -c ci-constraints.txt
      - name: Run tests with coverage
        # pytest-cov 7.x prints `FAIL Required test coverage of N% not reached`
        # but does not propagate a non-zero exit when the test session passed,
        # which can leave a sub-threshold coverage run inside a green CI job.
        # We therefore collect coverage here without `--cov-fail-under` and
        # enforce the gate explicitly in the next step via `coverage report
        # --fail-under=80`, which is guaranteed to exit non-zero when below.
        run: |
          cd agentic-workflows-v2
          python -m pytest tests/ -q \
            -m "not integration and not slow" \
            --cov=agentic_v2 \
            --cov-report=term-missing
      - name: Enforce 80% coverage gate
        run: |
          cd agentic-workflows-v2
          python -m coverage report --fail-under=80
      - name: Report whole-repo coverage (visibility only)
        if: success() || failure()
        run: |
          pip install -e "agentic-v2-eval/[dev]" -c ci-constraints.txt
          COVERAGE_FILE=.coverage-whole-repo python -m pytest \
            agentic-workflows-v2/tests \
            agentic-v2-eval/tests \
            -q \
            -m "not integration and not slow" \
            --ignore=agentic-workflows-v2/tests/e2e \
            --cov=agentic-workflows-v2/agentic_v2 \
            --cov=agentic-v2-eval/src/agentic_v2_eval \
            --cov=tools \
            --cov-config=/dev/null \
            --cov-report=term-missing \
            --cov-report=xml:coverage-whole-repo.xml
      - name: Upload whole-repo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-repo-coverage
          path: coverage-whole-repo.xml
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage-whole-repo.xml
          fail_ci_if_error: false

  wire-format-drift:
    # Sprint B #3 / S1-1 — prevent silent Python <-> TypeScript wire-format drift.
    # Sources of truth:
    #   agentic_v2/contracts/events.py              → events.schema.json + events.generated.ts
    #   agentic_v2/server/models.StepResultRecord   → step_result.schema.json + step_result.generated.ts
    #   agentic_v2/server/models.DAGResponse        → dag_response.schema.json + dag_response.generated.ts
    #   agentic_v2/server/models.WorkflowInputSchemaResponse → workflow_input_schema.schema.json + workflow_input_schema.generated.ts
    #   agentic_v2/server/models.WorkflowEditorStep → workflow_editor_step.schema.json + workflow_editor_step.generated.ts
    #   agentic_v2/server/models.RunsSummaryResponse → runs_summary.schema.json + runs_summary.generated.ts
    # This job regenerates all committed artifacts and fails the PR if the
    # working tree no longer matches what's checked in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agentic-workflows-v2/ui/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "agentic-workflows-v2/[dev,server]" -c ci-constraints.txt
      - name: Install UI
        run: |
          cd agentic-workflows-v2/ui
          npm ci
      - name: Regenerate execution event schema
        run: |
          cd agentic-workflows-v2
          python -m scripts.generate_ts_types
      - name: Regenerate TypeScript types
        run: |
          cd agentic-workflows-v2/ui
          npm run generate:types
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- \
              agentic-workflows-v2/tests/schemas/events.schema.json \
              agentic-workflows-v2/tests/schemas/step_result.schema.json \
              agentic-workflows-v2/tests/schemas/dag_response.schema.json \
              agentic-workflows-v2/tests/schemas/workflow_input_schema.schema.json \
              agentic-workflows-v2/tests/schemas/workflow_editor_step.schema.json \
              agentic-workflows-v2/tests/schemas/runs_summary.schema.json \
              agentic-workflows-v2/ui/src/api/events.generated.ts \
              agentic-workflows-v2/ui/src/api/step_result.generated.ts \
              agentic-workflows-v2/ui/src/api/dag_response.generated.ts \
              agentic-workflows-v2/ui/src/api/workflow_input_schema.generated.ts \
              agentic-workflows-v2/ui/src/api/workflow_editor_step.generated.ts \
              agentic-workflows-v2/ui/src/api/runs_summary.generated.ts; then
            echo "::error::Wire-format drift detected. Run 'python -m scripts.generate_ts_types' and 'npm run generate:types' (from agentic-workflows-v2/ui/) and commit the result."
            exit 1
          fi

  e2e-streaming:
    # Epic 2 Story 2.2 — Playwright streaming PR gate.
    # Runs the streaming spec 5× to catch flakes early. The rolling nightly
    # 50× job (Story 2.4) measures the long-term flake rate.
    #
    # Uses AGENTIC_NO_LLM=1 so the backend spawns PlaceholderChatModel for
    # all tier-1/tier-2 agents. This eliminates GitHub Models rate-limit
    # failures on back-to-back runs (429 → 41 s retry > 30 s Playwright
    # timeout) while still exercising the full streaming + reconnect path.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agentic-workflows-v2/ui/package-lock.json
      - name: Install backend (server extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,langchain]" -c ci-constraints.txt
      - name: Install UI + Playwright
        run: |
          cd agentic-workflows-v2/ui
          npm ci
          npx playwright install --with-deps chromium
      - name: Run streaming E2E 5×
        env:
          AGENTIC_NO_LLM: "1"
        run: |
          cd agentic-workflows-v2/ui
          npm run test:e2e:5x
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            agentic-workflows-v2/ui/test-results/
            agentic-workflows-v2/ui/playwright-report/
            agentic-workflows-v2/ui/e2e-results.json
          retention-days: 14
          if-no-files-found: ignore

  no-llm-smoke:
    # SB-2: runs the full unit suite with AGENTIC_NO_LLM=1 and zero API keys.
    # Contributors without provider credentials can use this job as their local CI baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev,server,langchain]" -c ci-constraints.txt
      - name: Validate deterministic workflow
        env:
          AGENTIC_NO_LLM: "1"
        run: |
          cd agentic-workflows-v2
          agentic validate test_deterministic
      - name: Run deterministic workflow end-to-end
        env:
          AGENTIC_NO_LLM: "1"
        run: |
          cd agentic-workflows-v2
          agentic run test_deterministic --input tests/fixtures/deterministic_input.json
      - name: Run no-LLM LangChain tests
        env:
          AGENTIC_NO_LLM: "1"
        run: |
          cd agentic-workflows-v2
          python -m pytest tests/langchain/test_no_llm_mode_langchain.py -q
      - name: Run unit tests (no API keys)
        env:
          AGENTIC_NO_LLM: "1"
        run: |
          cd agentic-workflows-v2
          python -m pytest tests/ -q \
            -m "not integration and not slow" \
            --ignore=tests/e2e \
            -x --timeout=120 2>&1 | tail -30

  # ── Documentation & schema quality gates (merged from doc-drift.yml) ──────
  # Cheap, high-signal checks; each completes in well under 30s on a warm runner.
  validate-workflows:
    name: Validate workflow YAMLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema
      - name: Validate workflow YAML definitions
        run: python scripts/validate-workflows.py

  check-doc-drift:
    name: Protocol ↔ ARCHITECTURE.md drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check protocol names appear in ARCHITECTURE.md
        run: python scripts/check-doc-drift.py

  pydocstyle:
    name: pydocstyle (core + contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pydocstyle
        run: |
          python -m pip install --upgrade pip
          pip install pydocstyle
      - name: Run pydocstyle on core/
        run: |
          pydocstyle \
            --convention=google \
            --add-ignore=D100,D104 \
            agentic-workflows-v2/agentic_v2/core/
      - name: Run pydocstyle on contracts/
        # D101: missing docstring in public class — Pydantic model classes
        # routinely skip class-level docstrings in favour of field-level
        # documentation.  Enforce only function/method docstrings here.
        run: |
          pydocstyle \
            --convention=google \
            --add-ignore=D100,D101,D104 \
            agentic-workflows-v2/agentic_v2/contracts/

  lockfile-constraints:
    # Reproducible installs: every Python job installs with
    # `-c ci-constraints.txt`, a pip constraints file derived from uv.lock so
    # transitive versions match the lock instead of resolving latest. This job
    # keeps uv.lock the single source of truth by regenerating the file and
    # failing on drift (mirrors the wire-format-drift gate). Without it, the
    # committed constraints could silently lag the lock.
    name: ci-constraints.txt in sync with uv.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Regenerate constraints from uv.lock
        run: |
          python -m pip install --upgrade pip
          pip install "uv==0.11.2"
          uv export --locked --no-hashes --no-emit-workspace \
            --all-packages --all-extras -o ci-constraints.txt
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- ci-constraints.txt; then
            echo "::error::ci-constraints.txt is out of sync with uv.lock. Regenerate with 'uv export --locked --no-hashes --no-emit-workspace --all-packages --all-extras -o ci-constraints.txt' and commit the result."
            exit 1
          fi

  dockerfile-constraints:
    # Reproducible Docker builds: every `pip install` in the Dockerfile must
    # pin to `-c ci-constraints.txt` (see lockfile-constraints above), or two
    # builds of the same commit can resolve different transitive dependency
    # versions. This job fails if any real `pip install` line in the
    # Dockerfile omits the constraints file.
    name: Dockerfile pip installs pin to ci-constraints.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify every pip install pins ci-constraints.txt
        shell: bash
        run: |
          set -euo pipefail
          dockerfile="Dockerfile"
          failed=0
          while IFS= read -r line; do
            if [[ "$line" == *"pip install"* ]] && [[ "$line" != *"--upgrade pip"* ]]; then
              if ! [[ "$line" =~ -c[[:space:]]+ci-constraints\.txt ]]; then
                echo "::error::Dockerfile pip install line missing '-c ci-constraints.txt': ${line}"
                failed=1
              fi
            fi
          done < "$dockerfile"
          if [[ "$failed" -eq 1 ]]; then
            echo "One or more 'pip install' lines in $dockerfile do not pin to ci-constraints.txt. Add '-c ci-constraints.txt' to each (except the 'pip install --upgrade pip' bootstrap line)."
            exit 1
          fi
          echo "All pip install lines in $dockerfile reference ci-constraints.txt."
