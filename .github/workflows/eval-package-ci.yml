name: Eval Package CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agentic-v2-eval/**'
      - 'tools/**'
      - 'datasets/**'
      - 'scripts/eval_gate.py'
      - 'agentic-workflows-v2/agentic_v2/scoring/**'
      - 'agentic-workflows-v2/tests/test_eval_gate*.py'
      - '.github/workflows/eval-package-ci.yml'
      - 'pyproject.toml'
      - 'ci-constraints.txt'
      - 'uv.lock'
  pull_request:
    branches: [main]
    # 'labeled' is added (on top of the default opened/synchronize/reopened)
    # so that adding the run-live-eval label to an ALREADY-OPEN PR re-triggers
    # this workflow -- without it, a label added after the PR was opened would
    # never fire the eval-live-gate job below until the next push.
    types: [opened, synchronize, reopened, labeled]
    # No `paths:` filter on pull_request: `eval-golden-gate` below is a REQUIRED
    # status check on main, so it must report on every PR. A path-filtered
    # required check that never runs would leave unrelated PRs stuck "Expected"
    # (unmergeable). eval-golden-gate has no `needs` and is unconditional. The
    # package jobs (test/type-check/build) are gated per-PR by the
    # `changes` job below (the eval `lint` job is deliberately NOT gated) and always run on push, schedule and workflow_dispatch;
    # eval-live-gate stays label-gated. The push trigger above keeps its paths
    # filter. NOTE: the job id `lint` below deliberately shares the required
    # context "lint" with ci.yml's `lint` job -- do not rename or merge it.
  schedule:
    # Nightly real-model eval-live-gate run on main, independent of the label
    # gate below. 06:00 UTC -- outside the 07:00 UTC nightly.yml E2E window
    # (see .github/workflows/nightly.yml) so the two nightly jobs don't
    # contend for runner capacity or provider rate limits at the same minute.
    - cron: '0 6 * * *'

concurrency:
  # PRs: one group per PR number, newer push (or label event) cancels the older
  # run. Everything else (push to main, schedule, dispatch): group per run, never
  # cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: agentic-v2-eval

jobs:
  changes:
    # PR-only path classification for the package jobs below. Fail OPEN: any
    # gate treats `needs.changes.result != 'success'` as "run", because a job
    # skipped for a failed `needs` would otherwise report success with nothing
    # run. eval-golden-gate does NOT depend on this job. The eval package is
    # self-contained: it installs only the repo-root agentic-tools package
    # (`pip install -e ..`, i.e. tools/ and the root pyproject.toml) plus
    # itself, so that is its whole dependency closure; datasets/ and
    # scripts/eval_gate.py feed only eval-golden-gate, which always runs.
    name: Detect eval package changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eval_pkg: ${{ steps.filter.outputs.eval_pkg }}
    steps:
      - name: Does this PR touch eval-package inputs?
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            eval_pkg:
              - 'agentic-v2-eval/**'
              - 'tools/**'
              - 'pyproject.toml'
              - 'ci-constraints.txt'
              - 'uv.lock'
              - '.github/workflows/eval-package-ci.yml'

  test:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.eval_pkg == 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # `uses:` steps ignore defaults.run.working-directory, so the path is
          # workspace-root relative. The key includes OS and Python version.
          cache: pip
          cache-dependency-path: ci-constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".." -c ../ci-constraints.txt
          pip install -e ".[dev]" -c ../ci-constraints.txt
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=src/agentic_v2_eval --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: agentic-v2-eval/coverage.xml
          flags: eval-package
          fail_ci_if_error: false

  lint:
    # Shares the required context "lint" with ci.yml's `lint` job (neither has a
    # `name:`): keep the id, and NEVER gate this job (no `needs:` / `if:`) -- a
    # fast skipped duplicate could show the context green while ci.yml's heavier
    # lint is still pending or red. It is ~15s, so it runs on every PR; `build`
    # still skips with test/type-check on non-eval PRs (its needs are skipped).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy -c ../ci-constraints.txt

      - name: Run ruff
        run: ruff check src/

      - name: Run ruff format check
        run: ruff format --check src/

  type-check:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.eval_pkg == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          # Same install set (and so the same key) as the ubuntu/3.11 test leg.
          cache: pip
          cache-dependency-path: ci-constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".." -c ../ci-constraints.txt
          pip install -e ".[dev]" -c ../ci-constraints.txt

      - name: Run mypy
        run: |
          python -m mypy src/agentic_v2_eval --config-file pyproject.toml

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, type-check]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: agentic-v2-eval/dist/

  eval-golden-gate:
    # Scored, deterministic, key-free golden eval gate. Scores the committed
    # dataset under datasets/default/ through the real runtime CriterionScorer and
    # exits non-zero when the weighted code-rubric score drops below the
    # committed threshold (0.80). AGENTIC_NO_LLM=1 is a fail-closed safety belt;
    # the gate path is pure arithmetic over committed JSON and never builds a
    # model. Runs from the repo ROOT (overriding the file-level working-directory)
    # because the dataset and runner (scripts/eval_gate.py) live at the root.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-workflows-v2/[dev]" -c ci-constraints.txt

      - name: Score golden dataset and enforce threshold
        env:
          AGENTIC_NO_LLM: "1"
        run: |
          python scripts/eval_gate.py --cases datasets/default/golden_cases.json --threshold 0.80

      - name: Verify runtime gate independence and mocked live behavior
        env:
          AGENTIC_NO_LLM: "1"
        run: |
          python -m pytest agentic-workflows-v2/tests/test_eval_gate_independence.py agentic-workflows-v2/tests/test_eval_gate_live.py -q --no-cov

  eval-live-gate:
    # Real-model eval-live-gate: runs scripts/eval_gate.py --live, which
    # replaces the mocked golden-file comparison with 3x real runs per case
    # through agentic_v2.workflows.run_workflow (SmartModelRouter / the shared
    # model client), scored by median weighted_score. This is NOT the
    # every-commit floor -- eval-golden-gate above stays deterministic,
    # key-free, and runs on every push/PR. This job only runs when a human
    # deliberately opts in:
    #   (a) a PR carries the 'run-live-eval' label, or
    #   (b) the nightly schedule (06:00 UTC, see the 'on.schedule' cron above)
    #       fires on main.
    # Everywhere else it is collected (visible in the Actions UI as a job of
    # this workflow) but SKIPPED via the 'if:' below, matching
    # scripts/eval_gate.py --live's own collected-but-skipped-without-a-key
    # behavior at the script level -- the two are independent, complementary
    # guards against running this unintentionally.
    #
    # No API keys are assumed to be configured in this repo's secrets; if
    # none of ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY /
    # AZURE_OPENAI_API_KEY / AZURE_FOUNDRY_API_KEY are set as repo secrets,
    # eval_gate.py --live itself exits 0 with a clear SKIPPED message rather
    # than failing the job -- see the --live docstring in scripts/eval_gate.py.
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-live-eval')) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "." -c ci-constraints.txt
          pip install -e "agentic-v2-eval/[dev]" -c ci-constraints.txt
          pip install -e "agentic-workflows-v2[server]" -c ci-constraints.txt

      - name: Run live eval gate (real model, median of 3 runs per case)
        env:
          # AGENTIC_NO_LLM is deliberately left unset here (never "0" -- unset,
          # so eval_gate.py's is_agentic_no_llm_enabled() reads False without
          # relying on a specific falsy string). Provider keys come from repo
          # secrets; any that are not configured resolve to an empty string,
          # which scripts/eval_gate.py's _has_live_provider_credentials()
          # treats the same as "not configured" -- so this step degrades to a
          # clean skip rather than a failure when no secrets are set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
        run: |
          python scripts/eval_gate.py --cases datasets/default/golden_cases.json --threshold 0.80 --live
