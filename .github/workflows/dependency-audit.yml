# Dependency Vulnerability Audit
#
# Implements NIST SP 800-218 (SSDF) PW.4.1:
#   "Verify software for vulnerabilities prior to release."
#   Both Python packages (via pip-audit) and the npm UI (via npm audit) are
#   scanned on every push to main, on a weekly schedule, and on demand. Any
#   HIGH or CRITICAL finding fails the build so that vulnerable dependencies
#   cannot reach production without a deliberate exception.
#
# Deliberately NOT run on pull requests: these audits are environment-scoped —
# their outcome changes when a new advisory is published against an existing
# dependency, not when a PR's diff changes — so as a PR gate they redline
# unrelated PRs the day an advisory drops. The diff-scoped PR gate is
# dependency-review.yml ("did THIS change introduce a vulnerable package?");
# this workflow monitors the environment on main instead.
#
# pip-audit does not expose a --severity filter flag. We use its JSON output
# and a Python post-processor to fail only on vulnerabilities that either
# (a) have a reported CVSS v3 base score >= 7.0 (HIGH/CRITICAL), or
# (b) have no reported score (treated as HIGH to be conservative).
# The audit results JSON is retained as a build artifact for 30 days.
#
# The npm job is built the same way, for a related reason: `npm audit
# --audit-level=high` owns the pass/fail decision itself and is all-or-nothing,
# so the only ways past a HIGH it cannot fix are to raise the threshold (which
# blinds the gate to every FUTURE high) or to change the dependency. It too now
# emits JSON and defers the decision to a post-processor, which carries an
# EXPIRING ALLOWLIST: a HIGH/CRITICAL advisory may be accepted only with a
# written justification and a review_by date, and the job FAILS once that date
# passes. Read the ALLOWLIST block in the npm-audit job before trusting a green
# run — it is the only thing standing between a HIGH finding and a red build.

name: Dependency Audit

on:
  push:
    # agenticv2 was removed from this list when the branch was retired from
    # origin; if it is ever recreated, add it BOTH here and to
    # dependency-review.yml's pull_request.branches so PRs into it keep a
    # diff-scoped dependency gate.
    branches: [main]
  schedule:
    # Weekly scan: Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  python-audit:
    name: pip-audit (Python packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        # setuptools is pinned >=83 because the runner environment (not any
        # first-party package) preinstalls an older copy carrying
        # PYSEC-2026-3447 / CVE-2026-59890 (HIGH, fixed in 83.0.0), which
        # otherwise fails the severity gate below.
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install pip-audit

      - name: Install all Python packages
        # Install all three first-party packages as EDITABLE (-e). They are
        # local source packages with no PyPI presence, so the --skip-editable
        # flag in the audit step deliberately excludes them from the scan
        # (no third-party advisories apply to our own code). Their transitive
        # third-party dependencies remain installed normally and ARE audited
        # via --local. Root agentic-tools is installed first so downstream
        # packages that import from `tools.*` resolve correctly.
        # NOTE: the paths use the local-directory form (-e "./<dir>[extras]");
        # dropping the "./" turns the argument into a PyPI lookup, which is the
        # bug that made earlier repairs fail ("No matching distribution").
        run: |
          pip install -e "."
          pip install -e "./agentic-workflows-v2[dev,server,langchain]"
          pip install -e "./agentic-v2-eval[dev]"

      - name: Run pip-audit (fail on HIGH/CRITICAL)
        # Scans the full shared environment that covers all three packages.
        # --skip-editable: our three first-party packages are installed editable
        #   (see step above) and are skipped here — they are our own source and
        #   carry no third-party advisories. Their transitive third-party deps
        #   ARE still audited via --local.
        # --format json: machine-readable output for the severity filter below.
        # --local: audit only packages installed in the current environment.
        # --desc on: include advisory descriptions in the output.
        #
        # NOTE: --strict is intentionally NOT used. pip-audit treats first-party
        # packages it cannot resolve on PyPI (or that are marked editable) as a
        # collection failure under --strict, aborts WITHOUT writing the JSON, and
        # exits 1. That produced the original red build (the reader below then hit
        # FileNotFoundError). Without --strict, those packages are skipped/warned
        # while every third-party dependency is still audited — no real vuln is
        # masked. The pass/fail decision is owned solely by the severity reader
        # below: it exits 1 only on a CVSS >= 7.0 (HIGH/CRITICAL) finding or a
        # vulnerability with no reported score (treated as HIGH, conservatively).
        # LOW/MODERATE advisories are reported but accepted (non-blocking).
        run: |
          set +e
          pip-audit \
            --skip-editable \
            --format json \
            --local \
            --desc on \
            --output audit-results.json \
          ; AUDIT_EXIT=$?
          set -e
          # pip-audit's own exit code is advisory only — it exits non-zero when
          # ANY vulnerability exists regardless of severity. We defer the gating
          # decision to the severity reader, so surface the raw code for logs
          # rather than acting on it. A genuine tool failure that leaves no JSON
          # behind is caught by the FileNotFoundError branch in the reader.
          echo "pip-audit raw exit code: ${AUDIT_EXIT}"

          python - <<'PYEOF'
          import json, sys

          try:
              with open("audit-results.json") as fh:
                  data = json.load(fh)
          except (FileNotFoundError, json.JSONDecodeError) as exc:
              print(f"ERROR: Could not read audit results: {exc}", file=sys.stderr)
              sys.exit(1)

          # pip-audit JSON schema: {"dependencies": [{"name", "version", "vulns": [...]}]}
          HIGH_CVSS_THRESHOLD = 7.0  # NIST definition of HIGH severity

          failing: list[dict] = []
          low_medium: list[dict] = []

          for dep in data.get("dependencies", []):
              for vuln in dep.get("vulns", []):
                  entry = {
                      "package": dep["name"],
                      "version": dep["version"],
                      "id": vuln.get("id", "UNKNOWN"),
                      "aliases": vuln.get("aliases", []),
                      "fix_versions": vuln.get("fix_versions", []),
                      "description": (vuln.get("description") or "")[:120],
                  }
                  # CVSS score may be present depending on advisory backend
                  cvss = vuln.get("cvss")
                  score = float(cvss) if cvss is not None else None

                  if score is None or score >= HIGH_CVSS_THRESHOLD:
                      # No score → treat as HIGH (conservative); score >= 7.0 → HIGH/CRITICAL
                      failing.append({**entry, "score": score})
                  else:
                      low_medium.append({**entry, "score": score})

          bar = "=" * 60

          if low_medium:
              print(f"\n{bar}")
              print(f"INFO: {len(low_medium)} LOW/MODERATE vulnerability(ies) — not blocking")
              print(bar)
              for v in low_medium:
                  score_str = f"{v['score']:.1f}" if v['score'] is not None else "unscored"
                  print(f"  [{score_str}] {v['package']} {v['version']} — {v['id']}")

          if failing:
              print(f"\n{bar}")
              print(f"FAIL: {len(failing)} HIGH/CRITICAL vulnerability(ies) detected")
              print(bar)
              for v in failing:
                  score_str = f"{v['score']:.1f}" if v['score'] is not None else "no-score→HIGH"
                  print(f"\n  Package : {v['package']} {v['version']}")
                  print(f"  CVSS    : {score_str}")
                  print(f"  ID      : {v['id']}")
                  if v['aliases']:
                      print(f"  Aliases : {', '.join(v['aliases'])}")
                  if v['fix_versions']:
                      print(f"  Fix in  : {', '.join(v['fix_versions'])}")
                  if v['description']:
                      print(f"  Desc    : {v['description']}")
              print(f"\n{bar}")
              print("Upgrade the packages above or add --ignore-vuln <ID> with justification.")
              sys.exit(1)
          else:
              total = len(low_medium)
              if total:
                  print(f"\nAudit passed — 0 HIGH/CRITICAL findings ({total} LOW/MODERATE skipped).")
              else:
                  print("\nAudit passed — no vulnerabilities found.")
          PYEOF

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-results
          # Glob (not a literal path) so the artifact is captured wherever the
          # audit writes it under the workspace. pip-audit --output writes
          # audit-results.json to the working directory; the glob keeps the
          # upload robust if that filename gains a suffix or moves into a subdir.
          path: "**/audit-results*.json"
          retention-days: 30
          # warn, not error: this step exists to RETAIN evidence, not to gate the
          # build. The severity reader above is the single authoritative gate and
          # already fails the job (FileNotFoundError) if the audit produced no
          # JSON. On a completed audit the file always exists; it is only absent
          # when an earlier step already failed the job — in which case a second
          # "no files found" error would just bury the real root cause in the log
          # (exactly what masked the true failure in earlier repair attempts).
          if-no-files-found: warn

  npm-audit:
    name: npm audit (UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agentic-workflows-v2/ui/package-lock.json

      - name: Install UI dependencies
        run: |
          cd agentic-workflows-v2/ui
          npm ci

      - name: Run npm audit (fail on HIGH/CRITICAL outside the allowlist)
        # Same shape as the python-audit job above: run the tool with JSON
        # output, defer the pass/fail decision to a post-processor, retain the
        # JSON as an artifact.
        #
        # --json: machine-readable output for the allowlist-aware reader below.
        #   npm audit exits non-zero whenever ANY vulnerability exists at or
        #   above the audit level, regardless of severity, so `set +e` keeps
        #   that from failing the step on its own. As in the python job the raw
        #   exit code is advisory only — echoed for the log, never acted on.
        #   A tool failure that leaves no parseable report behind is caught by
        #   the schema check in the reader.
        #
        # python3 (not `python`) because the Ubuntu runner image ships python3
        # as a base package; this job deliberately does NOT add an
        # actions/setup-python step just to run a reader.
        run: |
          cd agentic-workflows-v2/ui
          set +e
          npm audit --json > npm-audit-results.json
          AUDIT_EXIT=$?
          set -e
          echo "npm audit raw exit code: ${AUDIT_EXIT}"

          python3 - <<'PYEOF'
          import datetime
          import json
          import sys

          # ------------------------------------------------------------------
          # EXPIRING ALLOWLIST — read this before you trust a green npm audit.
          #
          # Each entry accepts exactly ONE advisory on ONE package, matched on
          # (id, package) exactly, and MUST carry a written reason plus a
          # review_by date. Once review_by has passed the job FAILS: an
          # exception that never expires is how a real vulnerability hides.
          # Adding an entry is a security decision, not a build fix — it goes
          # in the PR description, not quietly into this list.
          # ------------------------------------------------------------------
          # Currently empty, and that is the desired steady state. The last
          # entry (GHSA-qwww-vcr4-c8h2, react-router) was retired on 2026-08-09
          # by resolution 2 of its own exit criteria: react-router moved to
          # 7.18.2, npm audit no longer reports the advisory against this tree,
          # and the post-processor flagged the entry as matching nothing. An
          # allowlist entry that matches nothing is worse than no entry — it
          # reads as an accepted risk that is in fact untracked.
          ALLOWLIST: list[dict[str, str]] = []

          BLOCKING_SEVERITIES = {"high", "critical"}
          REQUIRED_FIELDS = ("id", "package", "reason", "review_by")
          REPORT = "npm-audit-results.json"

          today = datetime.datetime.now(datetime.timezone.utc).date()

          # Validate the allowlist before the report. A missing reason or a
          # typo'd date must fail loudly here rather than degrade into a
          # suppression nobody can evaluate or that never comes due.
          allow_index = {}
          for entry in ALLOWLIST:
              missing = [f for f in REQUIRED_FIELDS if not entry.get(f)]
              if missing:
                  print(
                      f"ERROR: allowlist entry {entry.get('id', '?')} is missing "
                      f"required field(s): {', '.join(missing)}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              try:
                  review_by = datetime.date.fromisoformat(entry["review_by"])
              except ValueError as exc:
                  print(
                      f"ERROR: allowlist entry {entry['id']} has an unparseable "
                      f"review_by ({entry['review_by']!r}): {exc}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              allow_index[(entry["id"], entry["package"])] = (entry, review_by)

          try:
              with open(REPORT) as fh:
                  report = json.load(fh)
          except (FileNotFoundError, json.JSONDecodeError) as exc:
              print(f"ERROR: Could not read audit results: {exc}", file=sys.stderr)
              sys.exit(1)

          # npm audit --json emits {"error": {...}} instead of a report when the
          # audit itself fails (unreachable registry, unresolvable tree), and a
          # future npm could change the schema. Either way we would be parsing
          # nothing and reporting a pass, so refuse to gate on a shape we do not
          # recognise. auditReportVersion 2 is what npm 7+ produces.
          if report.get("auditReportVersion") != 2:
              print(
                  "ERROR: unexpected npm audit report "
                  f"(auditReportVersion={report.get('auditReportVersion')!r}). "
                  f"Payload head: {json.dumps(report)[:300]}",
                  file=sys.stderr,
              )
              sys.exit(1)


          def advisory_id(via):
              """GHSA id for an advisory object, falling back to npm's own id.

              npm puts the advisory URL in `via.url`
              (https://github.com/advisories/GHSA-xxxx-xxxx-xxxx); the GHSA id
              is its last segment and is the stable identifier an allowlist
              entry should name. `via.source` is npm's numeric advisory id and
              is only used when a URL is absent.
              """
              url = via.get("url") or ""
              if url.startswith("https://github.com/advisories/"):
                  return url.rsplit("/", 1)[-1]
              return f"npm-advisory-{via.get('source', 'unknown')}"


          # Collect one record per distinct ADVISORY, not per vulnerable package.
          # In the v2 report a package's `via` holds either advisory objects (the
          # package the advisory is actually filed against) or plain strings (the
          # name of another vulnerable package it depends on). Every string chain
          # terminates at an advisory object elsewhere in the same report, so
          # gating on the objects covers the whole tree exactly once — and means
          # accepting an advisory does not also require allowlisting each of its
          # dependents by name.
          advisories = {}
          for name, pkg in report.get("vulnerabilities", {}).items():
              for via in pkg.get("via", []):
                  if not isinstance(via, dict):
                      continue
                  record = {
                      "id": advisory_id(via),
                      "package": via.get("name", name),
                      "severity": (via.get("severity") or "unknown").lower(),
                      "title": via.get("title", ""),
                      "range": via.get("range", pkg.get("range", "")),
                      "url": via.get("url", ""),
                      "dependents": pkg.get("effects", []),
                  }
                  advisories[(record["id"], record["package"])] = record

          meta = report.get("metadata", {}).get("vulnerabilities", {})
          reported_blocking = meta.get("high", 0) + meta.get("critical", 0)
          parsed_blocking = [
              a for a in advisories.values() if a["severity"] in BLOCKING_SEVERITIES
          ]

          # Cross-check npm's own tally against what we parsed. The counts are
          # not comparable in magnitude (npm counts vulnerable PACKAGES, we count
          # ADVISORIES, and one advisory can make several packages vulnerable),
          # but "npm says there are HIGHs and we found none to evaluate" can only
          # mean the parse is wrong. Failing here is what stops a schema drift
          # from silently disarming this gate.
          if reported_blocking and not parsed_blocking:
              print(
                  f"ERROR: npm reports {reported_blocking} HIGH/CRITICAL package(s) "
                  "but no advisory objects could be parsed from the report — "
                  "refusing to pass on an unreadable audit.",
                  file=sys.stderr,
              )
              sys.exit(1)

          accepted, expired, blocking, informational = [], [], [], []
          matched = set()

          for adv in sorted(advisories.values(), key=lambda a: (a["package"], a["id"])):
              if adv["severity"] not in BLOCKING_SEVERITIES:
                  informational.append(adv)
                  continue
              allowed = allow_index.get((adv["id"], adv["package"]))
              if allowed is None:
                  blocking.append(adv)
                  continue
              entry, review_by = allowed
              matched.add((entry["id"], entry["package"]))
              if review_by < today:
                  expired.append((adv, entry, review_by))
              else:
                  accepted.append((adv, entry, review_by))

          # An entry matching nothing is dead config. It is reported, not failed:
          # it goes stale precisely when the advisory is fixed or the dependency
          # is dropped, and redlining main on that good outcome teaches people to
          # stop writing entries. It cannot hide anything either — matching is
          # (id, package)-exact, so a stale entry can only ever suppress the one
          # advisory it names — and its review_by still forces removal on time.
          stale = [e for e in ALLOWLIST if (e["id"], e["package"]) not in matched]

          bar = "=" * 60
          counts = ", ".join(
              f"{sev} {meta.get(sev, 0)}"
              for sev in ("info", "low", "moderate", "high", "critical")
          )
          print(f"\nnpm audit: {meta.get('total', 0)} vulnerable package(s) — {counts}")

          if informational:
              print(f"\n{bar}")
              print(
                  f"INFO: {len(informational)} LOW/MODERATE advisory(ies) — not blocking"
              )
              print(bar)
              for a in informational:
                  print(f"  [{a['severity']}] {a['package']} {a['range']} — {a['id']}")
                  if a["dependents"]:
                      print(f"      dependents: {', '.join(a['dependents'])}")

          if accepted:
              print(f"\n{bar}")
              print(f"ACCEPTED: {len(accepted)} allowlisted HIGH/CRITICAL — not blocking")
              print(bar)
              for a, entry, review_by in accepted:
                  print(f"\n  Package   : {a['package']} {a['range']}")
                  print(f"  Severity  : {a['severity']}")
                  print(f"  ID        : {a['id']}")
                  if a["title"]:
                      print(f"  Title     : {a['title']}")
                  print(
                      f"  Review by : {entry['review_by']} "
                      f"({(review_by - today).days} day(s) left — this job FAILS after)"
                  )
                  print(f"  Accepted  : {entry['reason']}")

          if stale:
              print(f"\n{bar}")
              print(f"WARNING: {len(stale)} stale allowlist entry(ies) — matched nothing")
              print(bar)
              for entry in stale:
                  print(f"  {entry['id']} ({entry['package']}) — delete it")

          if expired:
              print(f"\n{bar}")
              print(f"FAIL: {len(expired)} allowlist entry(ies) past their review date")
              print(bar)
              for a, entry, review_by in expired:
                  print(f"\n  Package   : {a['package']} {a['range']}")
                  print(f"  ID        : {a['id']}")
                  print(
                      f"  Review by : {entry['review_by']} "
                      f"(expired {(today - review_by).days} day(s) ago)"
                  )
                  print(f"  Accepted  : {entry['reason']}")
              print(f"\n{bar}")
              print(
                  "Re-verify each advisory above and either remediate it or renew "
                  "the entry with a new review_by AND an updated justification."
              )

          if blocking:
              print(f"\n{bar}")
              print(f"FAIL: {len(blocking)} HIGH/CRITICAL advisory(ies) not on the allowlist")
              print(bar)
              for a in blocking:
                  print(f"\n  Package  : {a['package']} {a['range']}")
                  print(f"  Severity : {a['severity']}")
                  print(f"  ID       : {a['id']}")
                  if a["title"]:
                      print(f"  Title    : {a['title']}")
                  if a["url"]:
                      print(f"  Advisory : {a['url']}")
                  if a["dependents"]:
                      print(f"  Dependents: {', '.join(a['dependents'])}")
              print(f"\n{bar}")
              print(
                  "Upgrade the packages above, or add an ALLOWLIST entry in "
                  ".github/workflows/dependency-audit.yml with a justification and "
                  "a review_by date."
              )

          if blocking or expired:
              sys.exit(1)

          print(
              "\nAudit passed — 0 unaccepted HIGH/CRITICAL "
              f"({len(accepted)} allowlisted, {len(informational)} LOW/MODERATE)."
          )
          PYEOF

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-results
          # Glob rather than a literal path, matching the python job: npm audit
          # writes the report into agentic-workflows-v2/ui (the step cd's there),
          # and the glob keeps the upload working if that location moves.
          path: "**/npm-audit-results*.json"
          retention-days: 30
          # warn, not error — same reasoning as the python job: this step retains
          # evidence, it does not gate. The reader above is the single
          # authoritative gate and already fails the job when the report is
          # missing or unparseable. The file is absent only when an earlier step
          # already failed, and a second "no files found" error would bury that
          # real root cause.
          if-no-files-found: warn
