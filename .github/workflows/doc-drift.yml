name: Doc-Drift & Schema Checks

# Runs cheap, high-signal documentation quality gates:
#   1. validate-workflows  — JSON-schema validation of workflow YAML definitions
#   2. check-doc-drift     — assert all @runtime_checkable Protocols appear in ARCHITECTURE.md
#   3. pydocstyle          — Google-convention docstring lint on public API modules
#
# All three jobs complete in well under 30 seconds on a warm runner.

on:
  push:
    branches: [main, agenticv2]
  pull_request:
    branches: [main, agenticv2]

# Use Node.js 24 for JS-backed actions (checkout, setup-python) per runner
# deprecation notice for Node.js 20 on 2026-09-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Validate workflow YAML definitions against the JSON schema
  # ---------------------------------------------------------------------------
  validate-workflows:
    name: Validate workflow YAMLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate workflow YAML definitions
        run: python scripts/validate-workflows.py

  # ---------------------------------------------------------------------------
  # Job 2: Protocol-to-docs drift check
  # ---------------------------------------------------------------------------
  check-doc-drift:
    name: Protocol ↔ ARCHITECTURE.md drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check protocol names appear in ARCHITECTURE.md
        run: python scripts/check-doc-drift.py

  # ---------------------------------------------------------------------------
  # Job 3: pydocstyle on public API surface (core/ and contracts/)
  # ---------------------------------------------------------------------------
  pydocstyle:
    name: pydocstyle (core + contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pydocstyle
        run: |
          python -m pip install --upgrade pip
          pip install pydocstyle

      - name: Run pydocstyle on core/
        run: |
          pydocstyle \
            --convention=google \
            --add-ignore=D100,D104 \
            agentic-workflows-v2/agentic_v2/core/

      - name: Run pydocstyle on contracts/
        # D101: missing docstring in public class — Pydantic model classes
        # routinely skip class-level docstrings in favour of field-level
        # documentation.  Enforce only function/method docstrings here.
        run: |
          pydocstyle \
            --convention=google \
            --add-ignore=D100,D101,D104 \
            agentic-workflows-v2/agentic_v2/contracts/
