name: swe_fix_review_loop
description: >-
  Arm B of the SWE fix A/B — same repair task, same inputs, same output
  contract, same rubric as Arm A. The difference is orchestration: root-cause
  analysis, an adversarial regression review, and a revision pass are separate
  steps, so any score delta is attributable to that structure alone.
version: "1.0"

capabilities:
  inputs: [bug_report, code_file, source_code, failing_test]
  outputs: [patched_source, root_cause, verification_report]

evaluation:
  rubric_id: swe_fix_v1
  scoring_profile: B
  criteria:
    - name: root_cause_accuracy
      definition: Accuracy of the stated root cause against the actual defect.
      evidence_required:
        - Causal chain from failing test to the defective line
        - No claim contradicted by the supplied source
      scale:
        "1": Root cause missed or wrong
        "2": Superficial; core cause missed
        "3": Correct cause, minor gaps
        "4": Accurate and evidenced
        "5": Precise, fully evidenced
      weight: 0.30
      critical_floor: 0.70
      formula_id: zero_one
    - name: patch_quality
      definition: Correctness and minimality of the returned file.
      evidence_required:
        - Returned source is a complete, parseable module
        - Change is confined to the defect, not a rewrite
      scale:
        "1": Does not parse or is truncated
        "2": Parses but does not address the cause
        "3": Addresses the cause, collateral edits present
        "4": Correct and reasonably scoped
        "5": Correct and minimal
      weight: 0.50
      critical_floor: 0.75
      formula_id: zero_one
    - name: verification
      definition: Specificity of the stated verification plan.
      evidence_required:
        - Names the test(s) that should now pass
      scale:
        "1": No verification stated
        "2": Generic assertion of correctness
        "3": Names the failing test
        "4": Names tests plus an edge case
        "5": Names tests, edge cases, and regression risk
      weight: 0.20
      formula_id: zero_one

inputs:
  bug_report:
    type: string
    description: Failing-test output plus the defect description for this case.
  code_file:
    type: string
    description: Repo-relative path of the single source file under repair.
  source_code:
    type: string
    description: >-
      The complete current contents of that file, defect included. Byte-identical
      to what Arm A receives.
  failing_test:
    type: string
    description: Node id of the test that currently fails.

steps:
  - name: root_cause_analysis
    agent: tier2_reviewer
    tools: []
    description: >-
      Name the single defective behaviour and the exact line responsible. Do not
      write a fix yet. Quote the offending line.
    inputs:
      bug_report: ${inputs.bug_report}
      source_code: ${inputs.source_code}
      failing_test: ${inputs.failing_test}
    outputs:
      root_cause: root_cause_statement

  - name: draft_repair
    agent: tier2_coder
    tools: []
    description: >-
      Return the COMPLETE corrected contents of the file addressing the stated
      root cause. Not a diff, not a fragment. Change only what the defect
      requires.
    depends_on: [root_cause_analysis]
    inputs:
      root_cause: ${steps.root_cause_analysis.outputs.root_cause}
      source_code: ${inputs.source_code}
      file_path: ${inputs.code_file}
    outputs:
      patched_source: draft_file_contents

  - name: regression_review
    agent: tier1_analyzer
    tools: []
    description: >-
      Adversarial pass over the draft against the original: does it change any
      behaviour beyond the stated defect, drop code, or leave the cause unfixed?
      List concrete risks, or state explicitly that there are none.
    depends_on: [draft_repair]
    inputs:
      draft: ${steps.draft_repair.outputs.patched_source}
      source_code: ${inputs.source_code}
      root_cause: ${steps.root_cause_analysis.outputs.root_cause}
    outputs:
      regression_risks: regression_risks

  - name: revise_repair
    agent: tier2_coder
    tools: []
    description: >-
      Return the FINAL complete contents of the file, resolving every risk the
      review raised. If it raised none, return the draft unchanged.
    depends_on: [regression_review]
    inputs:
      draft: ${steps.draft_repair.outputs.patched_source}
      regression_risks: ${steps.regression_review.outputs.regression_risks}
      source_code: ${inputs.source_code}
      file_path: ${inputs.code_file}
    outputs:
      patched_source: final_file_contents

  - name: verification_plan
    agent: tier2_tester
    tools: []
    description: State which tests should now pass and what regression to watch.
    depends_on: [revise_repair]
    inputs:
      patched_source: ${steps.revise_repair.outputs.patched_source}
      root_cause: ${steps.root_cause_analysis.outputs.root_cause}
      failing_test: ${inputs.failing_test}
    outputs:
      verification_report: verification_plan

outputs:
  patched_source:
    from: ${steps.revise_repair.outputs.patched_source}
  root_cause:
    from: ${steps.root_cause_analysis.outputs.root_cause}
  verification_report:
    from: ${steps.verification_plan.outputs.verification_report}
