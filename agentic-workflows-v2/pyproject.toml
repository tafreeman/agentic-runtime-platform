[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-workflows-v2"
version = "0.1.0"
description = "Tier-based multi-model AI workflow orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.14.2,<3",
    "httpx>=0.25,<1",
    # Official Ollama client backing OllamaBackend (ADR-036). >=0.5.1 for the
    # `think` parameter (separated reasoning channel). Already resolved
    # transitively via langchain-ollama; pinned directly so the always-on
    # local backend does not depend on the optional `langchain` extra.
    "ollama>=0.5.1,<1",
    "jinja2>=3.0,<4",
    "jmespath>=1.0,<2",
    "pyyaml>=6.0,<7",
    "aiofiles>=23.0,<26",
    "aiohttp>=3.14.3,<4",
    "filelock>=3.0,<4",
    "cachetools>=5.0,<8",
    "typer>=0.9,<1",
    "rich>=13.0,<14",
    "python-json-logger>=3.0,<4",
    "agentic-tools",
]

[tool.uv.sources]
agentic-tools = { workspace = true }
# ADR-023 Option A′: ExecutionKit is consumed as the published PyPI release
# (`executionkit` on PyPI), not an editable sibling path — so the workspace
# resolves cleanly on any checkout and in CI without a co-located EK clone.
# Re-add an editable path source here if active EK↔runtime co-development resumes.


[project.optional-dependencies]
# ADR-023 Option A′: the ExecutionKit execution kernel (single package; the
# `executionkit-contracts` seam is dropped), consumed from the published PyPI
# release. httpx (an EK [httpx] extra) is already a base runtime dependency, so
# EK's value types + error tree import with no extra.
ek = ["executionkit>=0.3.0,<0.4.0"]
# agentic-evalkit: standalone offline evaluation toolkit, now a public package
# on PyPI. Consumed as a normal versioned PyPI dependency; CI can install this
# extra now that the repo is public (no cross-repo credential needed).
eval = [
    "agentic-evalkit>=0.3.0,<0.4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.2",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.19",
    "fakeredis[lua]>=2.21,<3",
    "jsonschema>=4.18",
    "pydocstyle>=6.3",
]
server = [
    "fastapi>=0.100,<1",
    "uvicorn[standard]>=0.23,<1",
    "python-multipart>=0.0.31,<1",
    "slowapi>=0.1.9,<1",
    "pyjwt[crypto]>=2.13,<3",
]
langchain = [
    # Upgraded from the 0.3/0.2 line to the 1.x line to clear 8 known
    # advisories (PYSEC-2026-76/77/83, CVE-2025-64439, CVE-2026-27794 [RCE],
    # CVE-2025-67644 [SQLi], CVE-2026-41182, CVE-2026-45134). Every fix version
    # was outside the previous pins, so a major-line bump was required.
    "langchain>=1.3.9,<2",
    "langchain-core>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.2,<2",
    "langchain-anthropic>=1.4.6,<2",
    "langchain-google-genai>=4.2,<5",
    "langchain-ollama>=1.1,<2",
    # langgraph-checkpoint is transitive but pinned explicitly: CVE-2026-27794
    # (RCE) is only fixed in 4.0.0, and CVE-2025-64439 in 3.0.0.
    "langgraph-checkpoint>=4.0.3,<5",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
    "langsmith>=0.8.18,<1",
]
tracing = [
    "opentelemetry-sdk>=1.20,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2",
    "opentelemetry-exporter-prometheus>=0.48b0,<1",
    "prometheus-client>=0.17,<1",
]
claude = [
    "anthropic>=0.40,<1",
    "claude-agent-sdk>=0.1,<1",
]
rag = [
    "lancedb>=0.15,<1",
    "litellm>=1.84,<2",
]
devex = [
    "psutil>=6.0",
]
mcp = [
    "websockets>=12.0,<17",
]
redis = [
    "redis[hiredis]>=5.0,<9",
]
sqlite = [
    "aiosqlite>=0.19,<1",
]
postgres = [
    "langgraph-checkpoint-postgres>=3.1.1,<4",
    "psycopg[binary]>=3.1,<4",
]

[project.scripts]
agentic = "agentic_v2.cli:main"


[tool.hatch.build]
exclude = [
    "/**/node_modules/**",
    "/.venv*/**",
    "/.run-logs/**",
    "/ui/dist/**",
    "/ui/node_modules/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/agentic_v2",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["agentic_v2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
filterwarnings = [
    "default:.*LangGraph adapter.*:DeprecationWarning",
]
markers = [
    "integration: end-to-end tests that call real agents/LLMs (deselect with -m 'not integration')",
    "slow: tests taking more than 5 seconds",
    "security: security-related tests",
    "unit: fast isolated unit tests with no external dependencies",
]

[tool.coverage.run]
branch = true
source = ["agentic_v2"]
omit = [
    # Optional provider/plugin surfaces are covered by their own targeted tests
    # or require external services. Keep the runtime gate focused on core code.
    "agentic_v2/agents/implementations/*",
    "agentic_v2/cli/helpers.py",
    "agentic_v2/config/__init__.py",
    "agentic_v2/devex/cli.py",
    "agentic_v2/engine/verification.py",
    "agentic_v2/engine/patterns/__init__.py",
    # ADR-023 ExecutionKit bridge: opt-in (AGENTIC_EK_PROVIDER), gated on the
    # optional `executionkit` dependency that the CI coverage job does not
    # install. Covered by the dedicated EK suite (tests/models/test_ek_*,
    # tests/engine/test_step_ek_*) which runs only when executionkit is present.
    "agentic_v2/engine/ek_step_delegation.py",
    "agentic_v2/models/ek_adapters.py",
    "agentic_v2/models/ek_provider.py",
    "agentic_v2/integrations/mcp/*",
    "agentic_v2/langchain/agents.py",
    "agentic_v2/langchain/model_builders.py",
    "agentic_v2/langchain/tools.py",
    "agentic_v2/models/backends_base.py",
    "agentic_v2/models/backends_cloud.py",
    "agentic_v2/models/backends_local.py",
    # client.py decomposed (FIX #5) — pure helpers now in testable sub-modules:
    #   cache_budget.py, fallback_selector.py, retry_utils.py, sanitization_dispatch.py
    # The main client.py glue still omitted (backend-wiring requires live providers).
    "agentic_v2/models/client.py",
    "agentic_v2/models/llm.py",
    "agentic_v2/prompts/*",
    "agentic_v2/workflows/runner.py",
]

[tool.coverage.report]
fail_under = 80
# Compare against the 2-decimal coverage value (e.g. 79.93%) rather than the
# rounded whole-number display, so a 79.93% measurement actually fails the
# 80% gate instead of being silently rounded up to 80% and treated as pass.
precision = 2
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# Ruff linting configuration
# ---------------------------------------------------------------------------
[tool.ruff.lint]
# Rule sets:
#   E/W  - pycodestyle errors and warnings
#   F    - Pyflakes (undefined names, unused imports)
#   I    - isort (import ordering)
#   N    - pep8-naming
#   UP   - pyupgrade (modernise Python syntax)
#   S    - flake8-bandit (security)
#   B    - flake8-bugbear (likely bugs and design issues)
#   A    - flake8-builtins (shadowing builtins)
#   C4   - flake8-comprehensions (simplify comprehensions)
#   SIM  - flake8-simplify
#   TCH  - flake8-type-checking (TYPE_CHECKING guards)
#   RUF  - Ruff-native rules
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH", "RUF"]

ignore = [
    # -------------------------------------------------------------------------
    # Originally requested suppressions
    # -------------------------------------------------------------------------

    # S101: Use of `assert` — asserts are idiomatic in test code and guard
    #       clauses; suppressed globally because S101 fires in production
    #       guard-clauses too.  Test-specific S101 is also listed under
    #       per-file-ignores for clarity.
    "S101",
    # S105: Hardcoded password string — too many false positives on test
    #       fixtures and placeholder config values (e.g. "secret", "token").
    #       Review real secrets via pre-commit detect-secrets instead.
    "S105",
    # S603: subprocess call — the codebase has intentional shell_ops.py
    #       wrappers; those are reviewed manually.
    #       Cleanup (target Q3 2026): audit each S603 site and replace with safer
    #       alternatives where possible.
    "S603",
    # S607: Starting a process with a partial executable path — same rationale
    #       as S603; shell_ops wrappers already validate paths.
    #       Cleanup (target Q3 2026): add which() resolution to all shell_ops callsites.
    "S607",
    # UP007: Use `X | Y` for Union — codebase still uses Optional[X] and
    #        Union[X, Y] in many places for clarity and shared-module compat.
    #        PEP 604 migration target Q3 2026.
    "UP007",

    # -------------------------------------------------------------------------
    # High-volume violations (>20 hits) — baselined 2026-04-21, target Q3 2026
    # -------------------------------------------------------------------------

    # UP045 (264 violations): `Optional[X]` → `X | None` — same PEP 604
    #   migration as UP007; addressing both together avoids a half-finished
    #   annotation pass.
    #   Cleanup (target Q3 2026): run `ruff check --fix --select UP045` then review diffs.
    "UP045",
    # E501 (118 violations): line-too-long (>88 chars) — majority are long
    #   string literals, URLs in comments, and auto-generated docstrings that
    #   cannot be auto-fixed without semantic review.
    #   Cleanup (target Q3 2026): reformat manually where wrapping improves readability;
    #   leave URL-only lines alone (add `# noqa: E501` per-line).
    "E501",
    # UP017 (66 violations): `datetime.timezone.utc` → `datetime.UTC` —
    #   datetime.UTC was introduced in Python 3.11; safe to migrate but the
    #   change touches ~20 files and warrants a dedicated commit.
    #   Cleanup (target Q3 2026): run `ruff check --fix --select UP017`.
    "UP017",
    # TC001 (43 violations): typing-only first-party imports not inside
    #   TYPE_CHECKING block — requires adding `if TYPE_CHECKING:` guards and
    #   quoting the affected annotations throughout the codebase.
    #   Cleanup (target Q3 2026): enable TC001 after wrapping imports; verify no circular
    #   import regressions.
    "TC001",
    # UP037 (41 violations): quoted annotations (string literals used as type
    #   hints) — fixable by either adding `from __future__ import annotations`
    #   or de-quoting; strategy should be uniform across the package.
    #   Cleanup (target Q3 2026): decide on PEP 563 vs. PEP 649 strategy, then apply.
    "UP037",
    # UP035 (32 violations): deprecated typing imports (`typing.List`,
    #   `typing.Dict`, etc.) — migrate to built-in generics (`list`, `dict`).
    #   Overlaps with UP006/UP007 migration; best done in one combined pass.
    #   Cleanup (target Q3 2026): run `ruff check --fix --select UP035,UP006`.
    "UP035",
    # C420 (29 violations): unnecessary dict comprehension for an iterable
    #   (use `dict(...)` or `{k: v for ...}` → `dict.fromkeys(...)`).
    #   Auto-fixable but produces semantically identical code; safe to defer.
    #   Cleanup (target Q3 2026): run `ruff check --fix --select C420`.
    "C420",
    # RUF022: unsorted `__all__` — the codebase intentionally groups __all__
    #   entries by logical category (phases, feature domains) rather than
    #   alphabetically; sorting would destroy semantic organization.
    "RUF022",

    # -------------------------------------------------------------------------
    # CI-unblock deferrals — baselined 2026-04-21, target Q3 2026
    # These rules each have <25 hits and are safe style-class suppressions
    # while we unblock CI. Tracked in tech-debt backlog.
    # -------------------------------------------------------------------------
    "UP042",   # replace-str-enum (20 hits)
    "E402",    # module-import-not-at-top-of-file (16 hits)
    "TC003",   # typing-only-standard-library-import (12 hits)
    # B904 removed — all raise-without-from sites fixed (Wave 3)
    "SIM105",  # suppressible-exception (8 hits)
    "RUF002",  # ambiguous-unicode-character-docstring (6 hits)
    "S311",    # suspicious-non-cryptographic-random-usage (6 hits) — non-security random
    # B905 removed — all zip() sites given explicit strict= (Wave 3)
    "SIM103",  # needless-bool (5 hits)
    "SIM108",  # if-else-block-instead-of-if-exp (5 hits)
    "B008",    # function-call-in-default-argument (4 hits)
    "F841",    # unused-variable (4 hits)
    "B007",    # unused-loop-control-variable (3 hits)
    "RUF012",  # mutable-class-default (3 hits)
    "TC002",   # typing-only-third-party-import (3 hits)
    "C408",    # unnecessary-collection-call (2 hits)
    "S307",    # suspicious-eval-usage (2 hits) — audit sites separately
    "SIM102",  # collapsible-if (2 hits)
    "C401",    # unnecessary-generator-set (1 hit)
    "N812",    # lowercase-imported-as-non-lowercase (1 hit)
    "RUF005",  # collection-literal-concatenation (1 hit)
    "SIM101",  # duplicate-isinstance-call (1 hit)

    # -------------------------------------------------------------------------
    # Story 1.8 CI-unblock additions — baselined 2026-04-21, target Q3 2026
    # These fire in pre-existing code; tracked in tech-debt backlog.
    # -------------------------------------------------------------------------
    "SIM117",  # multiple-with-statements (11 hits) — merge nested `with` blocks
    "RUF003",  # ambiguous-unicode-character-comment (7 hits) — EN DASH in comments
    "N806",    # non-lowercase-variable-in-function (8 hits) — mock class names in tests
    "RUF059",  # unused-unpacked-variable (6 hits) — `_` unpacking in for-loops
    "A001",    # builtin-variable-shadowing (4 hits) — `input` parameter name
    "RUF043",  # pytest-raises-ambiguous-pattern (3 hits) — match= string patterns
    # B017 removed — all assertRaises(Exception) sites narrowed (Wave 3)
    "RUF015",  # unnecessary-iterable-allocation-for-first-element (2 hits)
    # E711 removed — intentional == None site carries inline noqa (Wave 3)
    "N818",    # error-suffix-on-exception-name (1 hit)
    "SIM115",  # open-file-with-context-handler (1 hit)
]

# ---------------------------------------------------------------------------
# Per-file overrides
# ---------------------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert statements (S101), hardcoded credential strings
# in fixtures (S105), and occasionally hardcoded passwords for mock objects (S106).
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "S108"]
# Re-exports inside try/except are flagged as unused by ruff ≥0.15.16 even when
# listed in __all__. Scoped to the specific __init__.py that uses this pattern.
"agentic_v2/agents/implementations/__init__.py" = ["F401"]

# ---------------------------------------------------------------------------
# isort configuration (via ruff's I rule set)
# ---------------------------------------------------------------------------
[tool.ruff.lint.isort]
known-first-party = ["agentic_v2"]

# ---------------------------------------------------------------------------
# Mypy static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# Strict annotation enforcement is relaxed while we pay down pre-existing type
# debt across agentic_v2/tools, integrations/mcp, and agentic_v2/integrations.
# Ratchet these back to true as modules are cleaned (target Q3 2026).
disallow_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
# Exclude test suite and example scripts — these are not part of the
# production type surface and would generate enormous noise.
exclude = ["tests/", "examples/"]

# ---------------------------------------------------------------------------
# Per-module overrides — modules with pre-existing type debt.
# Address module-by-module and remove overrides (target Q3 2026).
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = [
    "agentic_v2.tools.builtin.*",
    "agentic_v2.integrations.mcp.*",
    "agentic_v2.integrations.tracing",
    "agentic_v2.integrations.langchain",
    "agentic_v2.langchain.config",
    "agentic_v2.langchain.nodes",
    "agentic_v2.langchain.dependencies",
]
ignore_errors = true

# Strict typing enabled incrementally for the core engine and contracts modules.
[[tool.mypy.overrides]]
module = ["agentic_v2.engine.*", "agentic_v2.contracts.*"]
disallow_untyped_defs = true
warn_return_any = true
