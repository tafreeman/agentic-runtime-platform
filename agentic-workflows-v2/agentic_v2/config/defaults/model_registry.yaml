# Curated single source-of-truth model registry (ADR-040).
#
# This file is the ONE place model identifiers, tier fallback chains, per-agent
# model defaults, and per-token prices are declared. router.py, langchain/models.py,
# and the named-agent loader all read from here -- adding or retiring a model is a
# deliberate, human-reviewed edit to this file.
#
# Design principle: dynamic for FACTS the runtime verifies (availability, health,
# rate-limit state); curated for JUDGMENTS a human owns (tier membership,
# capability, price). The probe WARNS + QUARANTINES retired ids; it never
# auto-promotes a new one into a chain.
#
# price_in / price_out are USD per 1,000,000 tokens (per-Mtok); null = unknown
# (spend is reported as None for that model, never guessed). Populating real
# numbers is a follow-up; provider /models endpoints do not expose pricing.
version: 1

models:
  # --- tier 1: fast / cheap (summarisation, extraction, simple tasks) ---
  - id: gemini:gemini-2.5-flash-lite
    provider: gemini
    tiers: [1]
    capability: fast
    status: active
    price_in: null
    price_out: null
    context_window: null
  - id: gh:openai/gpt-4o-mini
    provider: gh
    tiers: [1]
    capability: fast
    status: active
    price_in: null
    price_out: null
    context_window: null
  # In this deployment OPENAI_BASE_URL is aliased to NVIDIA NIM, so plain
  # ``openai:`` OpenAI ids (gpt-4o*) can never be served and were permanently
  # quarantined by the boot drift check — the NIM catalog is declared under
  # the ``nvidia:`` provider instead (ADR-051).
  - id: nvidia:meta/llama-3.1-8b-instruct
    provider: nvidia
    tiers: [1]
    capability: fast
    status: active
    price_in: null
    price_out: null
    context_window: null
  - id: anthropic:claude-haiku-4-5-20251001
    provider: anthropic
    tiers: [1]
    capability: fast
    status: active
    price_in: null
    price_out: null
    context_window: null
  - id: ollama:gemma4:31b
    provider: ollama
    tiers: [1]
    capability: local
    status: active
    price_in: 0.0
    price_out: 0.0
    context_window: null

  # --- tier 2-3: balanced (code review, moderate reasoning) ---
  - id: gemini:gemini-2.5-flash
    provider: gemini
    tiers: [2, 3]
    capability: balanced
    status: active
    price_in: null
    price_out: null
    context_window: null
  - id: gh:openai/gpt-4o
    provider: gh
    tiers: [2, 3, 4, 5]
    capability: balanced
    status: active
    price_in: null
    price_out: null
    context_window: null
  - id: nvidia:deepseek-ai/deepseek-v4-flash
    provider: nvidia
    tiers: [2, 3]
    capability: balanced
    status: active
    price_in: null
    price_out: null
    context_window: null
  # Undated alias: Anthropic dropped the dated ``-20260219`` id from its
  # /v1/models listing (the boot probe quarantined it on every start).
  - id: anthropic:claude-sonnet-4-6
    provider: anthropic
    tiers: [2, 3, 4]
    capability: balanced
    status: active
    price_in: null
    price_out: null
    context_window: null
  - id: ollama:qwen3-coder:30b
    provider: ollama
    tiers: [2, 3, 4, 5]
    capability: local
    status: active
    price_in: 0.0
    price_out: 0.0
    context_window: null

  # --- tier 4-5: capability escalation (hard problems, deep analysis) ---
  - id: gemini:gemini-2.5-pro
    provider: gemini
    tiers: [4, 5]
    capability: reasoning
    status: active
    price_in: null
    price_out: null
    context_window: null
  - id: nvidia:deepseek-ai/deepseek-v4-pro
    provider: nvidia
    tiers: [4, 5]
    capability: reasoning
    status: active
    price_in: null
    price_out: null
    context_window: null
  - id: anthropic:claude-opus-4-6
    provider: anthropic
    tiers: [5]
    capability: reasoning
    status: active
    price_in: null
    price_out: null
    context_window: null

# Ordered fallback chains per tier. Reconciled from the previously divergent
# router.DEFAULT_CHAINS (escalating, cloud-only) and langchain._TIER_FALLBACK_CHAINS
# (flat, +local). Resolution = cloud-capability-first then a local Ollama tail;
# tiers 4-5 escalate to gemini-2.5-pro / claude-opus-4-6 (ADR-040).
tiers:
  1:
    - gemini:gemini-2.5-flash-lite
    - gh:openai/gpt-4o-mini
    - nvidia:meta/llama-3.1-8b-instruct
    - anthropic:claude-haiku-4-5-20251001
    - ollama:gemma4:31b
  2:
    - gemini:gemini-2.5-flash
    - gh:openai/gpt-4o
    - nvidia:deepseek-ai/deepseek-v4-flash
    - anthropic:claude-sonnet-4-6
    - ollama:qwen3-coder:30b
  3:
    - gemini:gemini-2.5-flash
    - anthropic:claude-sonnet-4-6
    - nvidia:deepseek-ai/deepseek-v4-flash
    - gh:openai/gpt-4o
    - ollama:qwen3-coder:30b
  4:
    - gemini:gemini-2.5-pro
    - anthropic:claude-sonnet-4-6
    - nvidia:deepseek-ai/deepseek-v4-pro
    - gh:openai/gpt-4o
    - ollama:qwen3-coder:30b
  5:
    - gemini:gemini-2.5-pro
    - anthropic:claude-opus-4-6
    - nvidia:deepseek-ai/deepseek-v4-pro
    - gh:openai/gpt-4o
    - ollama:qwen3-coder:30b

# NOTE: named-agent model selection is NOT in this registry. Agents resolve
# their model via their tier (the chains above); the default_model/fallback_models
# fields in agents.yaml are vestigial display config (the /api/agents route reads
# only name/description/tier). See ADR-040.

# Special-purpose ids referenced by individual call sites. (The GitHub-backup
# fallback list stays in langchain/model_utils.GH_BACKUP_MODELS next to the
# provider gate it belongs to; its ids are already declared in models: above.)
special:
  judge_default: nvidia:deepseek-ai/deepseek-v4-pro
  notebooklm_fallback: gemini:gemini-2.5-pro
  tier_ultimate_fallback: ollama:qwen3-coder:30b
