# Ordered fallback chains per tier. Reconciled from the previously divergent
# router.DEFAULT_CHAINS (escalating, cloud-only) and langchain._TIER_FALLBACK_CHAINS
# (flat, +local). Resolution = cloud-capability-first then a local Ollama tail;
# tiers 4-5 escalate to gemini-2.5-pro / claude-opus-4-6 (ADR-040).
tiers:
  1:
    - gemini:gemini-2.5-flash-lite
    - gh:openai/gpt-4o-mini
    - nvidia:meta/llama-3.1-8b-instruct
    - anthropic:claude-haiku-4-5-20251001
    - ollama:gemma4:31b
  2:
    - gemini:gemini-2.5-flash
    - gh:openai/gpt-4o
    - nvidia:deepseek-ai/deepseek-v4-flash
    - anthropic:claude-sonnet-4-6
    - ollama:qwen3-coder:30b
  3:
    - gemini:gemini-2.5-flash
    - anthropic:claude-sonnet-4-6
    - nvidia:deepseek-ai/deepseek-v4-flash
    - gh:openai/gpt-4o
    - ollama:qwen3-coder:30b
  4:
    - gemini:gemini-2.5-pro
    - anthropic:claude-sonnet-4-6
    - nvidia:deepseek-ai/deepseek-v4-pro
    - gh:openai/gpt-4o
    - ollama:qwen3-coder:30b
  5:
    - gemini:gemini-2.5-pro
    - anthropic:claude-opus-4-6
    - nvidia:deepseek-ai/deepseek-v4-pro
    - gh:openai/gpt-4o
    - ollama:qwen3-coder:30b

# NOTE: named-agent model selection is NOT in this registry. Agents resolve
# their model via their tier (the chains above); the default_model/fallback_models
# fields in agents.yaml are vestigial display config (the /api/agents route reads
# only name/description/tier). See ADR-040.

# Special-purpose ids referenced by individual call sites. (The GitHub-backup
# fallback list stays in langchain/model_utils.GH_BACKUP_MODELS next to the
# provider gate it belongs to; its ids are already declared in models: above.)
special:
  judge_default: nvidia:deepseek-ai/deepseek-v4-pro
  notebooklm_fallback: gemini:gemini-2.5-pro
  tier_ultimate_fallback: ollama:qwen3-coder:30b
