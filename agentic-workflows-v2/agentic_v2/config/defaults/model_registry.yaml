# Curated single source-of-truth model registry (ADR-040).
#
# This file is the ONE place model identifiers, tier fallback chains, per-agent
# model defaults, and per-token prices are declared. router.py, langchain/models.py,
# and the named-agent loader all read from here -- adding or retiring a model is a
# deliberate, human-reviewed edit to this file.
#
# Design principle: dynamic for FACTS the runtime verifies (availability, health,
# rate-limit state); curated for JUDGMENTS a human owns (tier membership,
# capability, price). The probe WARNS + QUARANTINES retired ids; it never
# auto-promotes a new one into a chain.
#
# price_in / price_out are USD per 1,000,000 tokens (per-Mtok); null = unknown
# (spend is reported as None for that model, never guessed). Populating real
# numbers is a follow-up; provider /models endpoints do not expose pricing.
#
# cost_lane is one of local (weights on this machine, no account/network/charge),
# free (no charge, a credential may still be required, rate limits often
# undocumented), or paid (metered). It is curated the same way price is -- a
# provider's /models listing does not expose it (ADR-040 "curated for
# judgments"). AGENTIC_MAX_COST_LANE filters get_model_candidates_for_tier
# against it (langchain/models.py); an entry with no cost_lane, or an id not in
# this file at all, is treated as paid -- fail closed, never guessed free.
#
# gh: (GitHub Models) is curated paid despite having a nominally free tier: the
# SWE-fix A/B campaign (agentic-workflows-v2/evals/swe_ab/) treated GITHUB_TOKEN
# as a must-not-reach credential alongside the metered providers because its
# rate limits and billing tie-in are undocumented for this deployment -- revisit
# if that is confirmed otherwise.
#
# The three nvidia: ids below are NOT confirmed against NVIDIA's curated
# free-endpoint list (build.nvidia.com "Free Endpoint" label; 14 ids captured
# in evals/swe_ab/docs/MODEL-INVENTORY-2026-08-27.md) -- their dateless ids
# don't string-match that list's dated ids (e.g. deepseek-v4-flash vs
# deepseek-v4-flash-0731), so they are curated paid until a human confirms the
# alias resolves to the same free-tier billing.
version: 1

models:
  # --- tier 1: fast / cheap (summarisation, extraction, simple tasks) ---
  - id: gemini:gemini-2.5-flash-lite
    provider: gemini
    tiers: [1]
    capability: fast
    status: active
    cost_lane: paid
    price_in: null
    price_out: null
    context_window: null
  - id: gh:openai/gpt-4o-mini
    provider: gh
    tiers: [1]
    capability: fast
    status: active
