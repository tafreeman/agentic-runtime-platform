# Round-robin load balancer in front of the scaled `backend` replicas.
#
# Docker Compose's embedded DNS resolves the service name `backend` to the set
# of replica container IPs. Using a `resolver` + a variable in proxy_pass forces
# nginx to re-resolve `backend` per request and round-robin across every live
# replica, so k6 traffic provably fans out across all replicas (the property the
# horizontal-scale + shared-Redis-CAS proof depends on).

worker_processes auto;
events { worker_connections 4096; }

http {
    access_log off;
    # Docker's embedded DNS server is always at 127.0.0.11.
    resolver 127.0.0.11 valid=1s ipv6=off;

    server {
        listen 80;

        # Re-resolve `backend` on every request → DNS round-robin across replicas.
        set $arp_backend "backend:8010";

        location / {
            proxy_pass http://$arp_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
