# SonarQube scanner configuration for agentic-runtime-platform.
sonar.projectKey=agentic-runtime-platform
sonar.sources=.

# Non-source / generated trees excluded from analysis.
sonar.exclusions=**/node_modules/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/coverage/**,**/runs/**,**/.git/**,**/*.min.js,package-lock.json,uv.lock

# Test code is excluded from the coverage denominator (it is exercised, not
# measured) so new-code coverage reflects production lines only.
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*_test.py,**/conftest.py,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/e2e/**

# Coverage reports (generate with: pytest --cov ... --cov-report=xml:coverage.xml ;
# vitest run --coverage). The lcov SF paths must be repo-relative for mapping.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=agentic-workflows-v2/ui/coverage/lcov.sonar.info

sonar.scm.disabled=true
